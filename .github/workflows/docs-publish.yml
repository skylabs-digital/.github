name: Docs publish (reusable)

# ============================================================================
# Announces a repo's section on docs.skylabs.digital and publishes its pages.
#
#   1. `sl cac apply --env prod --file cac/docs.ts --no-create-keys`
#        the section (slug, name, group, icon, description, owner) is config as
#        code, declared with @skylabs-digital/docs-cac.
#   2. `sl docs sync`
#        validates `docs.dir` from deploy/skylabs.yaml and uploads it.
#
#   3. a `repository_dispatch` to skylabs-digital/docs so the site rebuilds now
#        (with the org App's token; optional, see the step).
#
# 1 and 2 authenticate with this job's GitHub Actions OIDC token (aud
# `docs.skylabs.digital`): no secret is needed for docs itself. GHCR_TOKEN is
# only for installing the private @skylabs-digital/* packages.
#
# WHICH `sl`: THE REPO'S OWN PIN when it has one that speaks `auth: github`
# (>= 1.21.0), else `cli-version` when the caller passes it, else 1.37.0.
# Until 2026-09-23 it was always the reusable's 1.21.0, and the descriptor
# schema is strict: resuelto's descriptor uses `de:` (sl 1.27), 1.21 rejected
# it, and resuelto's docs never published — hidden by `continue-on-error`
# (DEP-19). The pin that wrote the descriptor is the one that can read it.
# A library without the cli pinned gets the fallback. The repo also needs
# `@skylabs-digital/docs-cac` (and `@skylabs-digital/cac`, which an app with
# CaC already has) so `cac/docs.ts` resolves its imports.
#
# Standard: skylabs-workspace docs/standards/docs-publishing.md
#
# ----------------------------------------------------------------------------
# HOW A REPO CALLS THIS — a job next to `release` in its release.yml:
#
#   docs:
#     needs: release
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     uses: skylabs-digital/.github/.github/workflows/docs-publish.yml@main
#     permissions:
#       contents: read
#       id-token: write
#     secrets: inherit
#
# WHY A SEPARATE REUSABLE, AND NOT A JOB INSIDE app-release/lib-release:
# a called workflow cannot ask for a permission its caller did not grant — the
# whole run fails at STARTUP, before any job, even if the job would be skipped.
# The app callers deliberately do not grant `id-token: write` to the release
# (kommi's release.yml says why). Putting an OIDC job inside app-release.yml
# would have broken the release of every app that has not granted it. Here the
# grant lives on the caller's `docs` job only, and a repo opts in by adding it.
#
# A DOCS FAILURE IS RED, NOT HIDDEN. This job used to be `continue-on-error`,
# so a descriptor that `sl` rejected left every release green and the docs
# unpublished for weeks (DEP-19). It is still a job of its own after
# `release`: a red here does not undo a deploy that worked (docs spec §9), it
# just says, on the run, that the docs did not go out. Only the optional
# rebuild request below stays `continue-on-error`: the site's cron covers it.
# ============================================================================

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version'
        type: string
        default: '24'
      runner-labels:
        description: 'JSON array of runner labels'
        type: string
        default: '["self-hosted","linux","x64","skylabs"]'
      stack-file:
        description: 'The CaC stack that announces the section'
        type: string
        default: 'cac/docs.ts'
      cli-version:
        description: >
          Force this `sl` version (>= 1.21.0: `auth: github`, `--no-create-keys`
          without a secrets sink, `X-Version`). Empty (default): the repo's own
          pin when it has one >= 1.21.0, else 1.37.0.
        type: string
        default: ''
      ref:
        description: >
          What to check out. Default `main`: after a release the version bump is
          a later commit than the one that triggered the run, and the version
          shown on the docs status page comes from package.json.
        type: string
        default: 'main'
    secrets:
      GHCR_TOKEN:
        description: 'Read access to the private @skylabs-digital/* npm packages'
        required: false
      SEMANTIC_RELEASE_APP_ID:
        description: 'The org GitHub App, to ask the docs repo for a rebuild (optional: without it the site rebuilds on its 15-minute cron)'
        required: false
      SEMANTIC_RELEASE_PRIVATE_KEY:
        description: 'Private key of that App'
        required: false

jobs:
  publish:
    name: Announce and publish docs
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      # Secrets cannot appear in a step's `if`; this can.
      HAS_APP: ${{ secrets.SEMANTIC_RELEASE_APP_ID != '' && secrets.SEMANTIC_RELEASE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      # A repo without a section is not an error: the job says so and ends.
      - name: Does this repo publish docs?
        id: detect
        env:
          STACK_FILE: ${{ inputs.stack-file }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/skylabs.yaml ] || ! grep -qE '^docs:' deploy/skylabs.yaml; then
            echo "::notice title=docs::deploy/skylabs.yaml declares no \`docs:\` — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$STACK_FILE" ]; then
            # Red, not a warning: `docs:` is declared, so docs are expected and
            # none would go out (DEP-19). Every repo that declares it has one.
            echo "::error title=docs::\`docs:\` is declared but $STACK_FILE does not exist: the section cannot be announced. See docs/standards/docs-publishing.md §5."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - if: steps.detect.outputs.publish == 'true'
        run: corepack enable
      - if: steps.detect.outputs.publish == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skylabs-digital'
          cache: yarn
      - if: steps.detect.outputs.publish == 'true'
        name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - if: steps.detect.outputs.publish == 'true'
        name: Resolve sl (the repo's pin, else cli-version, else 1.37.0)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CLI_VERSION: ${{ inputs.cli-version }}
          MIN_VERSION: '1.21.0'
          FALLBACK_VERSION: '1.37.0'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/sl-bin"
          mkdir -p "$bin"
          pj="node_modules/@skylabs-digital/cli/package.json"
          pinned=""
          if [ -f "$pj" ]; then pinned="$(node -p "require('./${pj}').version")"; fi
          newest_of_two() { printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1; }
          if [ -z "$CLI_VERSION" ] && [ -n "$pinned" ] && [ "$(newest_of_two "$MIN_VERSION" "$pinned")" = "$pinned" ]; then
            # `yarn sl` resolves the repo's own pin from node_modules.
            printf '#!/bin/sh\nexec yarn sl "$@"\n' > "$bin/sl"
            chmod 0755 "$bin/sl"
            echo "sl: this repo's pin, ${pinned}"
          else
            want="${CLI_VERSION:-$FALLBACK_VERSION}"
            npm install --prefix "$RUNNER_TEMP/sl" --no-save --no-audit --no-fund \
              "@skylabs-digital/cli@${want}"
            ln -sf "$RUNNER_TEMP/sl/node_modules/.bin/sl" "$bin/sl"
            echo "sl: ${want} (repo pin: ${pinned:-none})"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      # `--env prod`: the registry is global (one docs site for every
      # environment), the protocol just requires one. `--no-create-keys`: this
      # stack has no keys, and without it `sl cac` demands a writable secrets
      # destination that a library does not have.
      # Since sl 1.36.0 an apply against qa/prod also requires the checkout to
      # be what's released: HEAD on origin/main (this job checks out `main`) and
      # no modified tracked file. A repo that tracks a file `yarn install`
      # rewrites (`.yarn/install-state.gz`) stops here until it untracks it.
      - if: steps.detect.outputs.publish == 'true'
        name: Announce the section (sl cac apply)
        env:
          STACK_FILE: ${{ inputs.stack-file }}
        run: |
          sl -v
          sl cac apply --env prod --file "$STACK_FILE" --no-create-keys

      - if: steps.detect.outputs.publish == 'true'
        name: Publish the pages (sl docs sync)
        id: sync
        run: sl docs sync

      # ASK THE SITE TO REBUILD NOW. The docs service stores the pages and marks
      # the site dirty, but it cannot start the build itself (it would need a
      # token of its own, DOCS_DISPATCH_TOKEN). This job already has the org App,
      # which can send a `repository_dispatch` to skylabs-digital/docs
      # (`contents: write`). Builds there collapse by themselves (one running,
      # at most one pending, and the pending one reads the whole store when it
      # starts), so twenty repos publishing at once cost two builds, not twenty.
      # Without the App, or if this fails, the build's 15-minute cron picks the
      # publication up: this step only saves the wait.
      - if: steps.sync.outcome == 'success' && env.HAS_APP == 'true'
        name: Token to ask docs for a rebuild
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: docs
          # A repository_dispatch needs contents:write on the target; nothing else.
          permission-contents: write

      - if: steps.app-token.outputs.token != ''
        name: Ask docs to rebuild now
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORIGEN: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The payload goes by stdin: nothing of it passes through argv.
          codigo="$(jq -nc --arg o "$ORIGEN" '{event_type: "docs-seccion-publicada", client_payload: {origen: $o}}' \
            | curl -sS -o /dev/null -w '%{http_code}' -X POST \
                "https://api.github.com/repos/${GITHUB_REPOSITORY_OWNER}/docs/dispatches" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @-)" || codigo=000
          if [ "$codigo" = "204" ]; then
            echo "rebuild requested: the site shows this section in a few minutes"
          else
            echo "::warning title=docs::could not ask docs for a rebuild (HTTP ${codigo}); its 15-minute cron will pick this publication up."
          fi
