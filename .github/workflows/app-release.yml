name: App Release (reusable)

# ============================================================================
# Reusable unified release pipeline for Skylabs Digital APPS. One file, 6
# stages, FULL-on-main / REDUCED-on-PR fork encoded ENTIRELY inside this
# reusable — callers only declare `on:` triggers; the service topology comes
# from the app's own `deploy/skylabs.yaml` descriptor via `@skylabs-digital/cli`.
#
#   STAGE 0  matrix           (every event: PR + push:main + schedule)
#   STAGE 1  static-checks    (every event: PR + push:main + schedule)
#   STAGE 1  security         (org reusable security.yml@main — every event)
#   STAGE 2  version          (push:main only — conventional-commit bumper)
#   STAGE 3  build-images     (needs version, bumped==true)
#   STAGE 4  image-scan        FOLDED INTO security.yml@main (Grype, push/sched only)
#   STAGE 5  deploy            (needs version + build, bumped==true — ONE job,
#                               ONE `sl deploy` invocation)
#   STAGE 6  secrets-rotate   (repository_dispatch `skylabs-operators-changed`
#                               only — re-cifra deploy/secrets/*.env)
#
# `repository_dispatch` es un CAMINO APARTE, no una etapa más del release: es
# el único evento en el que corre `secrets-rotate`, y el único en el que NO
# corren `static-checks` ni `security` (una rotación de recipients no trae
# código). `version` ya exige `push`, así que build/deploy/cac quedan afuera
# solos. Un caller que no declara el trigger no nota ningún cambio.
#
# The fork point is the `version` job: `if: push && ref==main && !chore(release)`.
# On a PR, `version` never runs, so every build-*/deploy-* job (each
# `needs: [version]` + `if: needs.version.outputs.bumped == 'true'`) is
# structurally unreachable. PRs therefore get exactly matrix + static-checks +
# security (REDUCED); main push gets the whole chain (FULL).
#
# All third-party actions are SHA-pinned here so every consumer inherits the
# supply-chain hardening for free.
#
# ----------------------------------------------------------------------------
# v2 (2026-09-10): la topología sale de `deploy/skylabs.yaml` y el deploy lo
# hace `sl deploy`. Se fueron los inputs `services`, `variant` y
# `smoke-base-url`, y los cinco pasos SSH. Una app que todavía no tiene
# descriptor pinea la rama `legacy-services`:
#
#   uses: skylabs-digital/.github/.github/workflows/app-release.yml@legacy-services
#
# Requisitos del caller v2: `deploy/skylabs.yaml`, `deploy/compose.yml`,
# `deploy/secrets/<env>.env` y `@skylabs-digital/cli` como devDependency.
#
# HOW A CONSUMING REPO CALLS THIS (minimal caller `.github/workflows/release.yml`):
#
#   name: Release
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#     schedule:
#       - cron: '0 6 * * 1'
#   permissions:
#     contents: write
#     packages: write
#     id-token: write
#   jobs:
#     release:
#       uses: skylabs-digital/.github/.github/workflows/app-release.yml@main
#       with:
#         deploy-env: qa
#         node-version: "24"
#       secrets: inherit
#
# `secrets: inherit` passes GHCR_TOKEN, SEMANTIC_RELEASE_APP_ID/_PRIVATE_KEY,
# DEPLOY_SSH_KEY, SOPS_AGE_KEY and the org-level vars through automatically.
#
# ----------------------------------------------------------------------------
# CONTRACT WITH THE DOCKERFILES (release-versioning.md §4, adopted 2026-09-02):
#
# Every image built is built with two build-args, guaranteed:
#
#   APP_VERSION=vX.Y.Z      the version the `version` job just computed and tagged
#   BUILD_COMMIT=<sha>      the exact commit being built: the one tag vX.Y.Z
#                           points at (the release commit), not github.sha
#
# A Dockerfile that wants them declares `ARG APP_VERSION` / `ARG BUILD_COMMIT`
# and fixes them as `ENV`; one that does not declare them silently ignores them
# (docker only warns). Runtime code reads the version in this order, never from
# package.json in production:
#
#   APP_VERSION  ->  BUILD_COMMIT  ->  package.json "version"  ->  "unknown"
#
# The version job is the ONLY place the number is decided; the commit it writes
# to main is a mirror for humans and local dev, not the source (see §1-§3 of
# the standard). Canonical snippet: resuelto/backend/src/api/version.ts.
# ============================================================================

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version'
        type: string
        default: '24'
      deploy-env:
        description: 'qa | prod — el GitHub Environment del job de deploy'
        type: string
        default: qa
      runner-labels:
        description: 'JSON array of runner labels'
        type: string
        default: '["self-hosted","linux","x64","skylabs"]'
      prune-images:
        description: >
          true → la poda de GHCR BORRA de verdad. El default es `false`, que
          corre igual y publica el plan en el resumen del job sin tocar nada,
          para que el efecto se lea antes de habilitarlo. La regla y sus
          resguardos están en ghcr-retention.yml; automatizar el borrado en
          toda la flota es una decisión aparte de la de este input.
        type: boolean
        default: false
      deploy:
        description: >
          false → el pipeline hace TODO menos desplegar: CI, versión, imagen,
          seguridad y CaC. Para un servicio que no se despliega con `sl deploy`
          porque su host no sale de `stacks.<env>.<stack>` — hoy `docs`, que
          corre en el droplet de monitor y se despliega con un job propio que
          llama a `deploy-service.sh monitor`, igual que el deploy-dashboard.
          El default es `true`: nadie que no pase este input cambia de
          comportamiento.
        type: boolean
        default: true
      sl-min-version:
        description: >
          The oldest `@skylabs-digital/cli` the repo may pin for the jobs that
          run `sl` against an environment (deploy, CaC). Default: the fleet's
          floor on 2026-09-23, so no app changes. Raise it to force a pin wave
          (DEP-08(3)).
        type: string
        default: '1.22.0'
    outputs:
      version:
        description: >
          La versión que publicó esta corrida, sin la `v` (`0.3.1`). Vacía si
          no hubo bump. La necesita quien se despliega por su cuenta
          (`deploy: false`): la imagen se construye del commit del bump, así
          que el `github.sha` del caller NO es el de la imagen.
        value: ${{ jobs.version.outputs.version }}
      bumped:
        description: '`true` si esta corrida publicó una versión nueva.'
        value: ${{ jobs.version.outputs.bumped }}
    secrets:
      GHCR_TOKEN:
        description: 'Classic PAT (read:packages + write:packages) for private npm installs and the GHCR docker login. NOT for cloning repositories: read:packages cannot check out a private repo, so the registry checkout uses a GitHub App token instead.'
        required: false
      NPM_READ_TOKEN:
        description: >-
          Read-only token (read:packages) for installing the private
          @skylabs-digital/* packages. Preferred over GHCR_TOKEN wherever the
          pipeline only READS packages, so the write-capable PAT stops reaching
          every `yarn install` of every PR (DEP-11). Optional: without it, the
          installs fall back to GHCR_TOKEN as before.
        required: false
      SEMANTIC_RELEASE_APP_ID:
        description: 'GitHub App id for semantic-release-bot-skylabs (mints git-push token)'
        required: false
      SEMANTIC_RELEASE_PRIVATE_KEY:
        description: 'GitHub App private key matching SEMANTIC_RELEASE_APP_ID'
        required: false
      DEPLOY_SSH_KEY:
        description: 'SSH key for the deploy user on QA/Prod droplets (mapped to SL_SSH_KEY for `sl deploy`)'
        required: false
      IDACHU_CAC_KEY:
        description: >-
          CaC against QA (skylabs/docs/standards/skylabs-cac.md §7-8): idachu PLATFORM
          key with idachu:cac + noten:cac. The org secret; it is NEVER sent to prod.
          Only read when the repo has cac/stack.ts; absent → the CaC jobs skip with a warning.
        required: false
      IDACHU_CAC_KEY_PROD:
        description: >-
          CaC against PROD: prod's idachu PLATFORM key, a secret of the calling repo's
          `prod` GitHub Environment (never an org secret). `sl cac --env prod` in CI
          takes only this name (cli#101): the org's IDACHU_CAC_KEY never satisfies prod.
          Absent on a prod release → the CaC jobs skip with a warning.
        required: false
      SOPS_AGE_KEY:
        description: >-
          Clave age de CI de la FLOTA (identidad ci-github-actions), secret de organización.
          Descifra deploy/secrets/<env>.env de la app. Sin ella, `sl deploy` no puede escribir
          el env de la app en el droplet.
        required: false

# husky must not run on the runner. Since the fleet moved hooks to
# `postinstall` (sl-06k), `yarn install` installs them in CI too — the checkout
# has a `.git` — and every git operation the workflow performs goes through
# them: semantic-release's `git commit` hits pre-commit/commit-msg and its
# `git push` runs the pre-push (a full `yarn ci`, duplicated). Measured on
# 2026-09-02: the extra minute inside the push is exactly the window in which
# a second merge to main lands and the push is rejected (menu-engine 16:04,
# react-proto-kit 16:23). CI is the gate here, not the hooks. See
# skylabs/docs/analyses/2026-09-02-revision-estabilidad-libs.md (sl-husky-en-ci).
env:
  HUSKY: 0

jobs:
  # ============================================================
  # STAGE 0 — MATRIZ
  # La topología sale del descriptor de la app (deploy/skylabs.yaml), no de un
  # JSON escrito a mano en el caller. Un servicio nuevo es una entrada en el
  # descriptor y nada más: build, scan y deploy lo ven solos.
  # ============================================================
  matrix:
    # Igual que `static-checks`: Dependabot no recibe secrets en sus propios
    # `pull_request`, y este job autentica `yarn install` con GHCR_TOKEN. A
    # diferencia de `static-checks`, SÍ corre en `schedule` — el leg de Grype
    # en `security` necesita una lista real de servicios para el scan
    # periódico, y en schedule el actor no es dependabot.
    # `repository_dispatch`: NO corre. Su único consumidor en ese evento sería
    # `security`, que queda salteado, y como no hay `needs:` con
    # `secrets-rotate`, un fallo suyo pintaría de rojo un run cuya rotación
    # salió bien. Es un `yarn install` + `sl app services` por app por rotación
    # que no consume nadie.
    if: github.actor != 'dependabot[bot]' && github.event_name != 'repository_dispatch'
    name: Servicios (del descriptor)
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    # Runs PR code (`yarn install`): read-only, whatever the caller granted (DEP-15).
    permissions:
      contents: read
    # Todos los jobs de este archivo corren en la pool self-hosted, que son
    # NUEVE runners para toda la flota: uno colgado no se recicla solo como una
    # VM de GitHub, se queda con su lugar hasta que alguien lo mate a mano. Las
    # cotas salen de medir 228 jobs reales de cinco repos (2026-09-14): el más
    # lento de todos fue el Deploy, con 14 minutos. Cada número de acá es ese
    # techo medido con aire de sobra — no es un presupuesto, es el punto donde
    # dejamos de creerle al job.
    timeout-minutes: 10
    outputs:
      services: ${{ steps.sl.outputs.services }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      - name: yarn sl app services
        id: sl
        run: |
          set -euo pipefail
          SERVICES="$(yarn sl app services --json | jq -c '.data.services')"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "${SERVICES}" | jq -r '.[] | "  · \(.name) (\(.kind)) ← \(.dockerfile)"' >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # STAGE 1 — STATIC CHECKS
  # `yarn ci` is the repo-wide gate: typecheck + lint + test + build across
  # every workspace. It runs ONCE. Until 2026-08-27 this was a matrix over
  # `services`, but `matrix.service` only ever reached the job NAME — never the
  # command — so every leg re-ran the identical repo-wide gate. Three services
  # meant three full copies per PR.
  #
  # That redundancy was not just waste, it was the failure. Node sizes its
  # old-space heap from the memory AVAILABLE AT STARTUP, so N copies of a
  # monorepo CI racing on one self-hosted runner means whichever leg starts last
  # gets a small heap and dies with "Ineffective mark-compacts near heap limit",
  # exit 129, before printing a line. Measured on resuelto (resuelto-5nw4): at
  # one commit, resuelto-api passed in 9m29s, resuelto-bo passed in 10m28s, and
  # resuelto-web died in 1m31s — same commit, same command, same code. A control
  # run on the last green commit had all three pass, so the runner is healthy;
  # the concurrency is what did not fit.
  #
  # BREAKING for consumers: this replaces N contexts named
  # "Static checks (<service>)" with a single "Static checks". Any ruleset that
  # requires the old strings by exact context will never see them again and will
  # block every PR until it is updated. Consumers track @main, so this lands on
  # all of them at once — deliberately, with the fleet owner's call.
  # ============================================================
  static-checks:
    # `repository_dispatch`: una rotación de recipients (job `secrets-rotate`)
    # no toca una línea de código — `yarn ci` entero no aporta nada ahí.
    if: github.actor != 'dependabot[bot]' && github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
    name: Static checks
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    # Runs PR code (`yarn ci`): read-only, whatever the caller granted (DEP-15).
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
      - name: CI (typecheck + lint + test + build)
        run: yarn ci

  # ============================================================
  # STAGE 1 — SECURITY (org reusable, @main) — also hosts STAGE 4 image-scan.
  # docker-images is derived from the descriptor matrix (job `matrix`), not
  # from a caller input. OSV + Gitleaks run on every event; Grype (image-scan)
  # runs push/schedule only — gated inside the reusable.
  # ============================================================
  security:
    # The job name keeps "@v1" on purpose: "release / Security (org reusable@v1) / …" is a
    # required status check in the org ruleset protect-main-apps and in each repo's ruleset.
    # Renaming it blocks every PR in the fleet until those rulesets are updated in lockstep.
    # The ref below is what decides the version: security.yml is consumed at @main, like the
    # rest of the reusables.
    name: Security (org reusable@v1)
    needs: [matrix]
    # `matrix` is skipped on Dependabot PRs (see its `if:` above). Today's
    # behavior is that `security` still runs OSV/Gitleaks on every event —
    # only Grype (image-scan) is gated to push/schedule, inside the reusable.
    # Replicate that here: run unless `matrix` actually failed/was cancelled,
    # falling back to an empty docker-images list when it was skipped. Grype
    # never sees that empty list anyway on a Dependabot PR, since
    # security.yml gates it to push/schedule internally.
    # `repository_dispatch`: una rotación de recipients (job `secrets-rotate`)
    # no trae código nuevo que escanear, y la matriz de Grype es lo más caro
    # del pipeline.
    if: ${{ !cancelled() && needs.matrix.result != 'failure' && github.event_name != 'repository_dispatch' }}
    uses: skylabs-digital/.github/.github/workflows/security.yml@main
    with:
      # security.yml reads only {name, context, dockerfile} per entry and
      # ignores the extra kind/health/migrator keys, so we forward it verbatim.
      docker-images: ${{ needs.matrix.result == 'success' && needs.matrix.outputs.services || '[]' }}
    secrets:
      # Grype builds each image to scan it, which runs `yarn workspaces focus`
      # and pulls the private @skylabs-digital/* packages from GHCR npm. Use the
      # GHCR_TOKEN PAT (read:packages) for that. Do NOT forward app-id/private-key:
      # security.yml prefers an ephemeral GitHub App installation token over
      # npm-token, but that App token lacks read:packages → 403 Forbidden on the
      # private-package install (whole Grype matrix fails). The App token is only
      # needed by the version stage (commit/tag push), which mints its own.
      npm-token: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}

  # ============================================================
  # STAGE 2 — VERSION BUMP  (THE FORK POINT)
  # Bespoke conventional-commit shell bumper (semantic-release is libs-only).
  # Only runs on push:main and never on its own release commit, so the whole
  # build+deploy tail is unreachable on PR/non-main/schedule (= REDUCED run).
  # ============================================================
  version:
    name: Bump version & tag
    needs: [static-checks, security]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release): v')
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    # Commits, tags and releases with the App token, not GITHUB_TOKEN.
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          # SIN `owner:` a propósito. Con `owner` el token sale con acceso a
          # TODOS los repos donde la App está instalada (los 41); sin él, la
          # action lo acota al repo actual, que es lo único que este job toca:
          # commitea el bump y pushea el tag en su propio repo.
          # Ver skylabs/docs/runbooks/apps-y-credenciales-de-la-org.md §1.

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "semantic-release-bot-skylabs[bot]"
          git config user.email "semantic-release-bot-skylabs[bot]@users.noreply.github.com"

      - name: Bump version + tag + push
        id: bump
        run: |
          set -euo pipefail

          # Todo el calculo de la version -- desde LAST_TAG hasta el commit y
          # el tag -- vive en esta funcion para poder RECALCULARLO ENTERO en
          # cada intento del push, no solo reintentar el mismo commit. Un
          # `return 1` (sin marcar error: `set -e` no mata el script dentro de
          # un `if !`) senala que no hay nada liberable en el rango ACTUAL --
          # la misma salida limpia tanto si es el primer intento (push a main
          # sin commits liberables) como si es un intento posterior (un
          # release concurrente ya cubrio todo lo que este intento iba a
          # liberar).
          compute_release() {
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            RANGE=$([ -z "$LAST_TAG" ] && echo "" || echo "${LAST_TAG}..HEAD")

            # DOS vistas del rango, a proposito:
            #   %s -> un subject por linea, para leer type/scope/`!`
            #   %B -> el mensaje COMPLETO, unica forma de ver el footer
            SUBJECTS=$(git log ${RANGE} --pretty=format:'%s')
            BODIES=$(git log ${RANGE} --pretty=format:'%B')

            # major: CUALQUIER type, con o sin scope, seguido de `!:` — la
            # forma canonica de Conventional Commits 1.0.0. `[^)]+` y no `.*`
            # dentro del scope: `.*` es greedy y en un subject con mas de un
            # `)` se come el cierre y desalinea el patron. Las dos vistas del
            # rango (SUBJECTS/BODIES en vez de solo `--oneline`) son porque el
            # footer `BREAKING CHANGE:` solo aparece en `%B`; medido: idachu
            # ca3c4da (2026-08-29) quedo huerfano, resuelto 388ff5b7 y kommi
            # 7311c549 salieron como MINOR siendo breaking.
            if printf '%s\n' "$SUBJECTS" | grep -qiE '^[a-z]+(\([^)]+\))?!:' \
              || printf '%s\n' "$BODIES" | grep -qE '^BREAKING[ -]CHANGE:'; then
              BUMP=major
            elif printf '%s\n' "$SUBJECTS" | grep -qiE '^feat(\([^)]+\))?:'; then
              BUMP=minor
            elif printf '%s\n' "$SUBJECTS" | grep -qiE '^(fix|perf|refactor)(\([^)]+\))?:'; then
              BUMP=patch
            # Dependency bumps and reverts change what runs, so they ship too
            # (DEP-12): a security bump that lands as `chore(deps)` used to
            # leave QA on the vulnerable version, with every check green, until
            # the next feat/fix. `(deps…)` is Dependabot's scope (`deps`,
            # `deps-dev`); `Revert "…"` is what GitHub's revert button writes.
            elif printf '%s\n' "$SUBJECTS" | grep -qiE '^((chore|build)\(deps(-dev)?\)|revert(\([^)]+\))?):|^revert "'; then
              BUMP=patch
            else
              return 1
            fi

            CURRENT=$(node -p "require('./package.json').version")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW="${MAJOR}.${MINOR}.${PATCH}"

            # Tag-collision guard: keep bumping patch until a free slot is found.
            git fetch --tags --force --quiet origin || true
            while git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null 2>&1 \
               || git ls-remote --exit-code --tags origin "refs/tags/v${NEW}" >/dev/null 2>&1; do
              echo "Tag v${NEW} already exists — bumping patch"
              PATCH=$((PATCH + 1))
              NEW="${MAJOR}.${MINOR}.${PATCH}"
            done

            echo "Bumping: ${CURRENT} → ${NEW} (${BUMP})"

            # Bump every package.json found (root + workspaces), shallow scan.
            for pj in package.json */package.json; do
              [ -f "$pj" ] || continue
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$pj','utf8'));if(p.version){p.version='$NEW';fs.writeFileSync('$pj',JSON.stringify(p,null,2)+'\n');}"
            done

            DATE=$(date +%Y-%m-%d)
            if [ -z "$LAST_TAG" ]; then
              RANGE_COMMITS=$(git log --oneline --pretty=format:"- %s (%h)")
            else
              RANGE_COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --pretty=format:"- %s (%h)")
            fi
            # `printf '%s'`, never `echo -e`: the subjects are user text, and
            # `echo -e` interprets them — a `\c` in a subject (`C:\config`)
            # stopped the output right there and the bumper committed a
            # CHANGELOG cut at that byte, history included (DEP-20).
            {
              printf '# Changelog\n\n## [%s] - %s\n\n%s\n\n' "$NEW" "$DATE" "$RANGE_COMMITS"
              if [ -f CHANGELOG.md ]; then tail -n +2 CHANGELOG.md; fi
            } > CHANGELOG.md.new
            mv CHANGELOG.md.new CHANGELOG.md

            git add -A
            git commit -m "chore(release): v${NEW} [skip ci]"
            # `-f`: un reintento puede dejar un tag LOCAL del intento anterior
            # con el mismo nombre, si el rango no cambio entre intentos.
            git tag -f -a "v${NEW}" -m "Release v${NEW}"
          }

          # Escribe la salida "no hay nada que liberar" — mismo shape en los
          # dos casos que la producen (ver mas abajo), solo cambia el motivo.
          no_releasable_commits() {
            local reason="$1"
            echo "::warning::${reason}"
            {
              echo "### Sin release"
              echo ""
              echo "${reason}"
              if [ -n "$SUBJECTS" ]; then
                echo ""
                echo "Subjects evaluados en el rango \`${LAST_TAG:-inicio}..HEAD\`:"
                echo ""
                printf '%s\n' "$SUBJECTS" | sed 's/^/- /'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          }

          # EL RUN SOLO PUBLICA LO QUE VALIDO (DEP-03, pre-mortem de despliegue
          # 2026-09-23). `static-checks`, Gitleaks y OSV corrieron sobre
          # GITHUB_SHA. Si `main` ya esta mas alla de GITHUB_SHA, recalcular
          # sobre `origin/main` publicaba commits que ningun run valido en main:
          # idachu run 35804850323 salio como v5.26.0 con bb1e3c0 y 31e1704
          # adentro, que solo pasaron por su PR sobre otra base.
          #
          # Asi que, si main se movio:
          #   - con al menos un commit que dispara CI: este run NO publica. Sale
          #     verde con bumped=false. El run del commit mas nuevo publica todo:
          #     GitHub solo cancela los runs *pending* viejos, nunca el mas nuevo,
          #     y su static-checks cubre ese HEAD.
          #   - solo con commits `[skip ci]` (una rotacion de recipients de
          #     `secrets-rotate`, un release de otro run): NO va a haber un run
          #     mas nuevo que publique, asi que se recalcula sobre origin/main
          #     como antes. Esos commits se eximieron de CI a proposito.
          main_moved_only_by_skip_ci() {
            local from="$1" to="$2" sha msg
            for sha in $(git rev-list "${from}..${to}"); do
              msg="$(git log -1 --format=%B "$sha")"
              if ! printf '%s' "$msg" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
                return 1
              fi
            done
            return 0
          }

          superseded() {
            local remote="$1"
            echo "::notice title=Release superseded::main advanced past ${GITHUB_SHA} (now ${remote}) with commits this run did not validate. Nothing published here: the run of the newer commit releases everything."
            {
              echo "### Sin release: lo publica un run más nuevo"
              echo ""
              echo "main avanzó de \`${GITHUB_SHA}\` a \`${remote}\` mientras este run esperaba o corría,"
              echo "con commits que este run no validó (DEP-03). The newer run releases them."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          }

          # Push el commit de release y su tag ATOMICAMENTE. Si lo rechazan
          # porque `main` se movio, NO se reintenta rebasando el MISMO commit:
          # se descarta, se refresca `origin/main`, y se decide segun lo de
          # arriba. Si `main` no se movio (el rechazo fue por un tag que otro
          # run publico), se RECALCULA la version entera desde cero.
          #
          # Por que. Dos releases que arrancan casi juntos parten del mismo
          # `CURRENT` y terminan tocando las MISMAS lineas de version en
          # `package.json`/`CHANGELOG.md` con contenido DISTINTO —
          # `3.3.1→3.3.2` en uno, `3.3.1→3.3.3` en el otro. Un rebase no puede
          # fusionar eso nunca, por diseño: son dos parches sobre la identica
          # linea, no un conflicto que un merge de tres vias pueda resolver.
          # La version anterior de este script reintentaba con `git rebase
          # origin/main`, que en ESTE caso exacto siempre aborta con
          # conflicto y tira el release entero a resolucion manual —
          # observado en idachu, PR #103 vs #101 mergeados con ~6 minutos de
          # diferencia (2026-08-31, run 33395817764) — aunque el commit
          # concurrente ya hubiera liberado TODO lo que este intento iba a
          # liberar. El guard de colision de tags de `compute_release` solo
          # evita nombres de tag repetidos: no se entera de que el archivo
          # que esta por commitear ya lo toco el release concurrente.
          #
          # Recalcular (sobre GITHUB_SHA, o sobre un main que solo avanzo con
          # `[skip ci]`) convierte el caso comun (el concurrente ya libero todo
          # esto) en un no-op limpio — `compute_release` devuelve 1 porque el
          # rango `LAST_TAG..HEAD` ya no tiene nada liberable — y el caso raro
          # (el concurrente liberaba ALGO pero no todo) en un bump correcto
          # sobre la base real, en vez de un commit corrupto o un conflicto que
          # bloquea el pipeline. Un main que avanzo con codigo nuevo no se
          # recalcula: lo publica su propio run (DEP-03, arriba).
          PUSHED=false
          BASE="${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            REMOTE="$(git rev-parse FETCH_HEAD)"
            if [ "$REMOTE" != "$BASE" ]; then
              if ! git merge-base --is-ancestor "$BASE" "$REMOTE"; then
                echo "::error::origin/main (${REMOTE}) no desciende de ${BASE}: alguien reescribio main. No se publica nada."
                exit 1
              fi
              if main_moved_only_by_skip_ci "$BASE" "$REMOTE"; then
                echo "main avanzo solo con commits [skip ci] (${BASE}..${REMOTE}): se recalcula sobre ${REMOTE}"
                BASE="$REMOTE"
              else
                superseded "$REMOTE"
                exit 0
              fi
            fi
            if [ "$attempt" -gt 1 ] || [ "$(git rev-parse HEAD)" != "$BASE" ]; then
              echo "Intento ${attempt}: descartando el commit de release anterior y recalculando sobre ${BASE}"
              git reset --hard --quiet "$BASE"
              # El tag LOCAL del intento anterior sobrevive al reset (`reset
              # --hard` solo mueve la rama y el working tree) y confundiria al
              # guard de colision de `compute_release`, que lo veria como si
              # ya estuviera publicado y saltearia una version de mas.
              [ -n "${NEW:-}" ] && git tag -d "v${NEW}" >/dev/null 2>&1 || true
            fi

            if ! compute_release; then
              if [ "$attempt" -eq 1 ]; then
                no_releasable_commits "Push a main sin commits liberables: NO se construyo ni desplego nada. Liberan: feat / fix / perf / refactor / revert, chore(deps) y build(deps), y cualquier type con '!' o con footer 'BREAKING CHANGE:'."
              else
                no_releasable_commits "Un release concurrente ya cubrio todo lo que este intento iba a liberar: NO se construyo ni desplego nada de mas."
              fi
              exit 0
            fi

            if git push --atomic origin HEAD:main "refs/tags/v${NEW}"; then
              PUSHED=true
              break
            fi
            echo "Push intento ${attempt} rechazado — main avanzo mientras corria este job"
            sleep $((attempt * 2))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::No se pudo publicar el release v${NEW} despues de 5 intentos (main no dejo de moverse)."
            exit 1
          fi

          echo "bumped=true" >> $GITHUB_OUTPUT
          echo "version=${NEW}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v2.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          body_path: CHANGELOG.md
          generate_release_notes: true

  # ============================================================
  # STAGE 3 — BUILD IMAGES
  # One matrix entry per service, sourced from the descriptor (job `matrix`).
  # Pushes vN + sha to GHCR. Unreachable on PR (needs version, which never
  # runs there).
  #
  # `:latest` is NOT pushed here when this pipeline deploys (DEP-17(1)): it
  # used to point at the newest BUILD before anyone knew whether its deploy
  # worked, and every `${X_TAG:-latest}` in a compose file (a fresh droplet,
  # a lost `<SVC>_TAG`) then started an image nobody had validated. It moves
  # together with `<env>-stable`, after a successful deploy. With
  # `deploy: false` there is no deploy to wait for, so it is pushed here as
  # before.
  # ============================================================
  build-images:
    name: Build image (${{ matrix.service.name }})
    needs: [version, matrix]
    if: needs.version.outputs.bumped == 'true'
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    # Pushes the images to GHCR with GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.matrix.outputs.services) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: v${{ needs.version.outputs.version }}
      # The commit the image is built FROM: the one the tag points at (the
      # release commit on top of what `version` validated), not
      # `github.sha`. They differed whenever `version` recalculated on a
      # newer main (DEP-03(2)): the image said BUILD_COMMIT=A while its
      # content was C + bump.
      - name: Commit of the tag
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v3.11.1
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v6.18.0
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:v${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:${{ steps.commit.outputs.sha }}
            ${{ !inputs.deploy && format('ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.service.name) || '' }}
          build-args: |
            BUILD_COMMIT=${{ steps.commit.outputs.sha }}
            APP_VERSION=v${{ needs.version.outputs.version }}
          secrets: |
            npm_token=${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

  # ============================================================
  # STAGE 5 — DEPLOY
  # UN job, UNA invocación. `sl deploy` hace adentro lo que antes eran cinco
  # pasos SSH en matriz: migraciones, deploy servicio por servicio (en el orden
  # que dice el descriptor), workers, smoke, promote, y además el registro del
  # borde y del monitoreo, que antes no hacía nadie. Unreachable on PR. Prod
  # is a separate, manually-approved path (not here).
  # ============================================================
  deploy:
    name: Deploy (${{ inputs.deploy-env }})
    needs: [version, build-images, matrix]
    if: needs.version.outputs.bumped == 'true' && inputs.deploy
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    # Retags `<env>-stable`/`latest` in GHCR with GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    # 45 and not 30: a failed deploy (up to ~15 min measured) can now be
    # followed by a full redeploy of the last-good release (DEP-04), and a
    # timeout in the middle of that rollback is the worst place to stop.
    timeout-minutes: 45
    environment: ${{ inputs.deploy-env }}
    # One deploy at a time per (app, env), shared with deploy-manual.yml
    # (DEP-14(3)). The droplet-side `flock` lasts ONE command, not the whole
    # deploy: a manual deploy could swap its fragment+env between this
    # deploy's swap and its `up`. Never cancelled mid-flight. GitHub keeps one
    # PENDING job per group: a third deploy queued behind two replaces the
    # waiting one (it shows as cancelled, and it never started).
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.deploy-env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: v${{ needs.version.outputs.version }}

      # El registro de la plataforma: sparse checkout de infra, sólo registry/.
      # Es de dónde salen el bastión, las IPs privadas y los recipients age.
      # El token sale de la App y dura una hora. Antes salía de INFRA_READ_TOKEN,
      # un PAT clásico con scope `repo` — o sea ESCRITURA en los 41 repos
      # privados — para leer un directorio. Su fallback declarado, GHCR_TOKEN,
      # no podía funcionar: tiene `read:packages` y con eso no se checkoutea un
      # repo privado. Nunca se notó porque INFRA_READ_TOKEN siempre estaba.
      - name: Token para leer el registro
        id: registry-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          # SÓLO `infra` y SÓLO lectura: el repo propio ya se checkouteó con el
          # GITHUB_TOKEN. Sin `permission-contents: read` el token salía con
          # todos los permisos de la App — escritura en infra, cuyos rulesets
          # la App saltea —, y en `cac-plan` eso corre con el código del PR
          # (SEC-02). El checkout no lo deja en .git/config.
          repositories: infra

      - name: Checkout del registro (sparse)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          repository: skylabs-digital/infra
          path: .infra-registry
          sparse-checkout: registry
          token: ${{ steps.registry-token.outputs.token }}

      - name: Install sops (pinned + checksum)
        # Mismo pin y mismo checksum que infra/.github/workflows/provision-env.yml.
        # Se baja en CADA job al $RUNNER_TEMP del job y se verifica siempre.
        # Antes vivía en $HOME/.local/bin, que sobrevive entre jobs en los
        # runners self-hosted: un sops plantado ahí por cualquier otro job del
        # pool quedaba en el PATH de un job con SOPS_AGE_KEY en el entorno, o
        # sea el binario que descifra prod (sl-zldd, SEC-03, DEP-02(3)). Un
        # $RUNNER_TEMP es del job y el runner lo vacía al terminar. No volver a
        # cachearlo en $HOME: son ~20 MB por job, y el ahorro no paga el riesgo.
        run: |
          set -euo pipefail
          SOPS_VER=v3.11.0
          SOPS_SHA=775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef
          SOPS_DIR="${RUNNER_TEMP}/sops-${SOPS_VER}"
          mkdir -p "$SOPS_DIR"
          curl -sSfL -o "$SOPS_DIR/sops" "https://github.com/getsops/sops/releases/download/$SOPS_VER/sops-$SOPS_VER.linux.amd64"
          if ! echo "$SOPS_SHA  $SOPS_DIR/sops" | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::the downloaded sops $SOPS_VER does NOT match the pinned checksum"
            rm -f "$SOPS_DIR/sops"
            exit 1
          fi
          chmod 0755 "$SOPS_DIR/sops"
          echo "$SOPS_DIR" >> "$GITHUB_PATH"

      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}

      # The `sl` this repo pins must be at least `sl-min-version` (DEP-08(3)).
      # Fixes land in `sl` (the checkout guard of 1.36, the key hashes of
      # 1.37) and reach no app until its pin moves; this is the lever that
      # makes a floor real. The default is today's fleet floor, so nothing
      # changes until the input (or the default) is raised.
      - name: sl version floor
        env:
          SL_MIN_VERSION: ${{ inputs.sl-min-version }}
        run: |
          set -euo pipefail
          pj="node_modules/@skylabs-digital/cli/package.json"
          if [ ! -f "$pj" ]; then
            echo "::error title=sl::@skylabs-digital/cli is not installed: add it to devDependencies (docs/standards/sl-en-los-repos.md)."
            exit 1
          fi
          have="$(node -p "require('./${pj}').version")"
          lowest="$(printf '%s\n%s\n' "$SL_MIN_VERSION" "$have" | sort -V | head -n1)"
          if [ "$lowest" != "$SL_MIN_VERSION" ]; then
            echo "::error title=sl too old::this repo pins @skylabs-digital/cli ${have}; the pipeline needs >= ${SL_MIN_VERSION}. Raise the pin in package.json."
            exit 1
          fi
          echo "sl ${have} (floor ${SL_MIN_VERSION})"

      # SSH HOST KEYS PINNED, NOT TOFU (DEP-10). `sl` connects with
      # `StrictHostKeyChecking=accept-new` against the runner's persistent
      # ~/.ssh/known_hosts: the first contact accepts ANY key (a MITM there is
      # silent) and, after the QA reset recreates a droplet on the same IP,
      # the old key makes every deploy die with "Host key verification failed"
      # until someone cleans nine hosts by hand.
      #
      # This step puts an `ssh` in front of the real one, for this job only,
      # that forces `StrictHostKeyChecking=yes` against a known_hosts written
      # to $RUNNER_TEMP. ssh keeps the FIRST value of each option, so ours win
      # over `sl`'s `accept-new`; and `sl`'s ProxyCommand (the bastion hop)
      # runs `ssh` through PATH too, so both hops are pinned. Sources, in order:
      #   1. registry/known_hosts in infra (the sparse checkout above): what
      #      infra would publish on every apply, so it survives recreation;
      #   2. the DEPLOY_KNOWN_HOSTS variable (org, repo or environment);
      #   3. neither: today's behaviour, with a warning.
      # The format is plain known_hosts: `10.10.10.2 ssh-ed25519 AAAA…` for a
      # droplet, `[bastion.host]:2222 ssh-ed25519 AAAA…` for the bastion.
      - name: Pin SSH host keys
        env:
          KNOWN_HOSTS_VAR: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_KNOWN_HOSTS: ${{ github.workspace }}/.infra-registry/registry/known_hosts
        run: |
          set -euo pipefail
          if [ -s "${REGISTRY_KNOWN_HOSTS}" ]; then
            src="registry/known_hosts (infra)"
            content="$(cat "${REGISTRY_KNOWN_HOSTS}")"
          elif [ -n "${KNOWN_HOSTS_VAR}" ]; then
            src="the DEPLOY_KNOWN_HOSTS variable"
            content="${KNOWN_HOSTS_VAR}"
          else
            echo "::warning title=SSH host keys not pinned::neither infra's registry/known_hosts nor the DEPLOY_KNOWN_HOSTS variable exist: ssh trusts on first use (accept-new) against this runner's persistent known_hosts (DEP-10)."
            exit 0
          fi
          real_ssh="$(command -v ssh)"
          dir="${RUNNER_TEMP}/ssh-pinned"
          mkdir -p "${dir}/bin"
          printf '%s\n' "${content}" > "${dir}/known_hosts"
          if ! ssh-keygen -l -f "${dir}/known_hosts" >/dev/null 2>&1; then
            echo "::error title=SSH host keys::${src} has no valid known_hosts line. Fix it, or remove it to fall back to trust-on-first-use."
            exit 1
          fi
          cat > "${dir}/bin/ssh" <<EOF
          #!/bin/sh
          exec "${real_ssh}" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${dir}/known_hosts" -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no "\$@"
          EOF
          chmod 0755 "${dir}/bin/ssh"
          echo "${dir}/bin" >> "$GITHUB_PATH"
          echo "SSH host keys pinned from ${src}: $(ssh-keygen -l -f "${dir}/known_hosts" | wc -l | tr -d ' ') key(s)"

      - name: Last good release (for the rollback)
        id: last-good
        continue-on-error: true
        env:
          SL_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SL_REGISTRY: ${{ github.workspace }}/.infra-registry/registry/apps.json
          CI: 'true'
          DEPLOY_ENV: ${{ inputs.deploy-env }}
          SERVICE: ''
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # What the droplet runs as last-good, BEFORE touching it. If this
          # deploy fails, the rollback redeploys that release from its own
          # checkout (DEP-04). Read-only (`sl deploy <env> status`); a failure
          # here only means the rollback falls back to images-only.
          SL_BIN="$(yarn bin sl 2>/dev/null || true)"
          echo "sl_bin=${SL_BIN}" >> "$GITHUB_OUTPUT"
          last=""
          if out="$(SL_FORMAT=json yarn sl deploy "${DEPLOY_ENV}" status --json 2>/dev/null | tail -n 1)"; then
            last="$(printf '%s' "$out" | jq -r --arg svc "${SERVICE}" '
              [(.data.services // .data.servicios // [])[] | select($svc == "" or .service == $svc) | .lastGood // empty]
              | unique | if length == 1 then .[0] else "" end' 2>/dev/null || true)"
          fi
          if [[ "${last}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "${last}" != "${TAG}" ]; then
            echo "tag=${last}" >> "$GITHUB_OUTPUT"
            echo "last good release in ${DEPLOY_ENV}: ${last}"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rollback::no single last-good release to restore (read: '${last}'). If this deploy fails, the rollback puts the images back but NOT the fragment and env of that release (DEP-04)."
          fi

      - name: sl deploy ${{ inputs.deploy-env }} --tag v${{ needs.version.outputs.version }}
        id: sl-deploy
        env:
          SL_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SL_REGISTRY: ${{ github.workspace }}/.infra-registry/registry/apps.json
          # Texto humano en el log del job: `sl` saca JSON por defecto fuera de
          # una TTY, y un JSON de 200 líneas no se lee en Actions.
          SL_FORMAT: text
          # Explícito y no sólo heredado del runner: evita el prompt interactivo
          # de confirmación en prod (`ctx.env.CI !== "true"` en deploy.ts).
          CI: 'true'
          DEPLOY_ENV: ${{ inputs.deploy-env }}
          TAG: v${{ needs.version.outputs.version }}
        run: yarn sl deploy "${DEPLOY_ENV}" --tag "${TAG}" --yes

      # The `<env>-stable` retag is bookkeeping on the registry, not part of
      # the deploy: a `docker pull` of 400 MB that gets cut, or GHCR having a
      # bad minute, used to turn a GOOD deploy red, fire the rollback (which
      # recreates every service) and skip cac-apply and the retention
      # (DEP-05(3)). Now it only warns. Rejected: `docker buildx imagetools
      # create -t`, the registry-side retag the analysis suggests. Measured
      # (buildx 0.33, --dry-run on a single-platform manifest): it wraps the
      # image in a NEW index, so `<env>-stable` would get another digest and a
      # manifest list, which breaks resuelto's size guard and the retention's
      # "one version per image" reading.
      - name: Log in to GHCR
        if: success()
        continue-on-error: true
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag as ${{ inputs.deploy-env }}-stable and latest
        # Sigue siendo un paso del workflow y no de `sl`: es una operación sobre
        # el REGISTRO de imágenes, no sobre un droplet, y el CLI no hace
        # operaciones de registro en esta etapa (regla de entrada del estándar).
        # `latest` se mueve acá y no en build-images: es lo último que un
        # deploy VALIDÓ, no lo último que se construyó (DEP-17(1)).
        if: success()
        continue-on-error: true
        env:
          SERVICES: ${{ needs.matrix.outputs.services }}
          TAG: v${{ needs.version.outputs.version }}
          DEPLOY_ENV: ${{ inputs.deploy-env }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for NAME in $(echo "$SERVICES" | jq -r '.[].name'); do
            IMAGE="ghcr.io/${OWNER}/${NAME}"
            docker pull "${IMAGE}:${TAG}"
            for CHANNEL in "${DEPLOY_ENV}-stable" latest; do
              docker tag "${IMAGE}:${TAG}" "${IMAGE}:${CHANNEL}"
              docker push "${IMAGE}:${CHANNEL}"
            done
          done

      # Qué: redeploy del último release bueno desde SU checkout (fragmento,
      # env, borde y monitoreo de ese release, no sólo las imágenes: DEP-04),
      # y si eso no se puede, el rollback de imágenes de siempre. Por eso
      # ahora SÍ lleva SOPS_AGE_KEY: descifra el env de ese release.
      #
      # Cuándo: sólo si el paso `sl deploy` MISMO falló o se canceló.
      #   - `failure()` a secas revertía también un deploy bueno cuando fallaba
      #     algo después (el retag de `<env>-stable`), con downtime y sin
      #     mover nada más (DEP-05(2)). `deploy-manual.yml` ya preguntaba por
      #     el outcome del paso.
      #   - `cancelled()`: un timeout del job o una cancelación a mano dejaban
      #     el droplet a mitad de camino y SIN rollback, porque `failure()` no
      #     es verdadero en una cancelación (DEP-13(2)). Actions le da a este
      #     paso unos minutos después de la cancelación.
      - name: Rollback on failure
        if: (failure() || cancelled()) && (steps.sl-deploy.outcome == 'failure' || steps.sl-deploy.outcome == 'cancelled')
        env:
          SL_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SL_REGISTRY: ${{ github.workspace }}/.infra-registry/registry/apps.json
          SL_FORMAT: text
          CI: 'true'
          DEPLOY_ENV: ${{ inputs.deploy-env }}
          SERVICE: ''
          DEPLOY_OUTCOME: ${{ steps.sl-deploy.outcome }}
          LAST_GOOD: ${{ steps.last-good.outputs.tag }}
          SL_BIN: ${{ steps.last-good.outputs.sl_bin }}
        run: |
          set -euo pipefail
          images_only() {
            local args=("${DEPLOY_ENV}" rollback)
            if [ -n "${SERVICE}" ]; then args+=("${SERVICE}"); fi
            yarn sl deploy "${args[@]}" --yes
          }
          echo "::warning::the deploy ${DEPLOY_OUTCOME}: rolling back ${SERVICE:-the app} in ${DEPLOY_ENV}"

          # A cancellation (job timeout, manual cancel) leaves minutes, not a
          # full redeploy: images only. Same when there is nothing to restore.
          if [ "${DEPLOY_OUTCOME}" = "cancelled" ] || [ -z "${LAST_GOOD}" ] || [ -z "${SL_BIN}" ]; then
            echo "::warning::images-only rollback: the droplet keeps the fragment and env of the failed release (DEP-04)."
            images_only
            exit 0
          fi

          # Redeploy the last-good release from ITS checkout: its images, its
          # compose fragment, its env (decrypted from its deploy/secrets), its
          # edge and monitoring. The images-only rollback swapped the images
          # back under the NEW fragment and env (appoint run 35770492946).
          # `--skip-migrate`: a migration is not reverted, and the old
          # migrator has nothing to add. The CURRENT `sl` runs it: an older
          # descriptor read by a newer `sl` is the compatible direction.
          WT="${RUNNER_TEMP}/last-good-${LAST_GOOD}"
          if git fetch --quiet --depth=1 origin "refs/tags/${LAST_GOOD}:refs/tags/${LAST_GOOD}" \
             && git worktree add --quiet --detach "${WT}" "${LAST_GOOD}"; then
            args=("${DEPLOY_ENV}")
            if [ -n "${SERVICE}" ]; then args+=("${SERVICE}"); fi
            args+=(--tag "${LAST_GOOD}" --skip-migrate)
            if (cd "${WT}" && node "${SL_BIN}" deploy "${args[@]}" --yes); then
              echo "::warning::rolled back to ${LAST_GOOD}: images, fragment, env, edge and monitoring of that release. Migrations already applied stay applied."
              exit 0
            fi
            echo "::error::redeploying ${LAST_GOOD} failed: falling back to the images-only rollback"
          else
            echo "::error::could not check out ${LAST_GOOD}: falling back to the images-only rollback"
          fi
          images_only

  # ============================================================
  # STAGE 5 — CaC (configuration as code)
  # skylabs/docs/standards/skylabs-cac.md §7. Opt-in by presence of
  # `cac/stack.ts` in the repo: nothing changes for repos without it.
  #
  # PR   → `yarn sl cac plan --env <deploy-env>`: the diff against the platform
  #        catalog, so the PR shows drift.
  # main → `yarn sl cac apply --env <deploy-env> --no-create-keys`, after the
  #        migrations and the deploy of every service: the code is live before
  #        the catalog (roles, flags, templates) is aligned to it. Keys are
  #        created by a person (a local apply), never by CI.
  #
  # The entry point is `sl` (`@skylabs-digital/cli`, pinned by each repo), NOT
  # a `cac` script of the repo's own: `@skylabs-digital/cac` 2.0.0 dropped its
  # binary and stayed a library, so `yarn cac` no longer resolves anywhere.
  # Every repo with a `cac/stack.ts` therefore needs `@skylabs-digital/cli` in
  # devDependencies and an `"sl": "sl"` script (docs/standards/sl-en-los-repos.md).
  #
  # `sl` exits 2 for findings — a plan with changes or orphans, an apply that
  # leaves orphans — which is not a failure per se. `cac-plan` therefore looks
  # at the payload, not the code: a plain diff annotates and stays green, an
  # ORPHAN reddens the PR and is named (skylabs-cac.md §7). `cac-apply` only
  # annotates: it runs after the deploy, and an orphan is a leftover resource,
  # not a broken release. See the comments on each step.
  #
  # Both jobs sparse-checkout `skylabs-digital/infra` for `registry/` and export
  # SL_REGISTRY: `sl cac` derives each provider's URL from `exports.<env>.URL`
  # of that app's descriptor and needs the registry to find it. It does NOT read
  # `<PREFIJO>_URL` from the environment the way `cac` 1.6 did.
  #
  # Credentials come from the GitHub Environment named after deploy-env:
  # vars IDACHU_URL / NOTEN_URL / FISTO_URL (one <PREFIX>_URL per provider the
  # stack uses; the CLI derives the name from the provider's envPrefix) and
  # secret IDACHU_CAC_KEY (an idachu PLATFORM key with idachu:cac + noten:cac +
  # fisto:cac) for qa, and IDACHU_CAC_KEY_PROD (the `prod` Environment's secret)
  # for prod: each job passes ONLY the one of its deploy-env, so QA's org key
  # never reaches prod (`sl` refuses it there anyway, cli#101). noten and fisto
  # have no key of their own — the CLI exchanges the platform key for a service
  # token (service-identity.md §4).
  # Without the secret the job warns and exits 0, so a repo can adopt the
  # stack before the org has minted the key.
  #
  # API KEYS: NOT VERIFIED IN CI, ON PURPOSE (DEP-07(1) vs CAC-19). Neither
  # CaC job has SOPS_AGE_KEY or sops, so every key reads as `unreadable` and
  # the provider leaves the registered one alone: a rotated key committed to
  # deploy/secrets reaches the droplet (the deploy decrypts it) but NOT idachu,
  # and nothing turns red. Handing these jobs the age key is NOT the fix: with
  # sl <= 1.37 a readable sops value is REGISTERED even with
  # --no-create-keys (cli key-material.ts), so CI would become the one that
  # rotates, after the deploy, with a 401 window; and in cac-plan any PR could
  # decrypt the app's secrets. What CI needs before it can verify keys:
  #   1. a cli mode that compares hashes and never registers (`--keys=verify`
  #      or `--keys=skip`, CAC-17), failing on a mismatch;
  #   2. then, in cac-apply ONLY (never cac-plan): the same pinned-sops step
  #      as `deploy` and `SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}` in the
  #      apply step's env, with `--no-create-keys --keys=verify`;
  #   3. `unreadable` in CI becomes an error instead of a note.
  # Until then both jobs assert that the age key is absent, and
  # scripts/tests/check_workflows.py fails if a CaC job ever references it.
  # ============================================================
  cac-plan:
    name: CaC plan (${{ inputs.deploy-env }})
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: static-checks
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    # Runs PR code (the branch's cac/stack.ts): read-only (DEP-15).
    permissions:
      contents: read
    timeout-minutes: 10
    environment: ${{ inputs.deploy-env }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      # Decide ACÁ si el job hace algo, antes de instalar nada y antes de pedirle
      # el registro a otro repo. Con el chequeo de la key metido más abajo, un
      # repo sin key igual hacía `yarn install` y el checkout de infra, y moría
      # en ese checkout en vez de saltearse: el `Not Found` de un repo al que su
      # token no llega tapaba un caso que siempre fue un skip inofensivo.
      - name: ¿Corre CaC en este repo?
        id: stack
        env:
          IDACHU_CAC_KEY: ${{ inputs.deploy-env != 'prod' && secrets.IDACHU_CAC_KEY || '' }}
          IDACHU_CAC_KEY_PROD: ${{ inputs.deploy-env == 'prod' && secrets.IDACHU_CAC_KEY_PROD || '' }}
          DEPLOY_ENV: ${{ inputs.deploy-env }}
        run: |
          # CAC-19: this job must not be able to decrypt deploy/secrets. With
          # the age key, `sl cac` would register sops values (rotate) from CI.
          if [ -n "${SOPS_AGE_KEY:-}" ]; then
            echo "::error title=CaC::SOPS_AGE_KEY is set in a CaC job: CI would register (rotate) API keys. See the comment on the CaC stage in app-release.yml."
            exit 1
          fi
          if [ ! -f cac/stack.ts ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No cac/stack.ts in this repo: CaC plan skipped."
          elif [ -z "${IDACHU_CAC_KEY}${IDACHU_CAC_KEY_PROD}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            key_name=IDACHU_CAC_KEY; [ "${DEPLOY_ENV}" = "prod" ] && key_name=IDACHU_CAC_KEY_PROD
            echo "::warning::${key_name} is not set in the '${DEPLOY_ENV}' environment: CaC plan skipped. This repo's CaC is NOT being verified on any PR."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - run: corepack enable
        if: steps.stack.outputs.present == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.stack.outputs.present == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        if: steps.stack.outputs.present == 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}

      # The `sl` this repo pins must be at least `sl-min-version` (DEP-08(3)).
      # Fixes land in `sl` (the checkout guard of 1.36, the key hashes of
      # 1.37) and reach no app until its pin moves; this is the lever that
      # makes a floor real. The default is today's fleet floor, so nothing
      # changes until the input (or the default) is raised.
      - name: sl version floor
        if: steps.stack.outputs.present == 'true'
        env:
          SL_MIN_VERSION: ${{ inputs.sl-min-version }}
        run: |
          set -euo pipefail
          pj="node_modules/@skylabs-digital/cli/package.json"
          if [ ! -f "$pj" ]; then
            echo "::error title=sl::@skylabs-digital/cli is not installed: add it to devDependencies (docs/standards/sl-en-los-repos.md)."
            exit 1
          fi
          have="$(node -p "require('./${pj}').version")"
          lowest="$(printf '%s\n%s\n' "$SL_MIN_VERSION" "$have" | sort -V | head -n1)"
          if [ "$lowest" != "$SL_MIN_VERSION" ]; then
            echo "::error title=sl too old::this repo pins @skylabs-digital/cli ${have}; the pipeline needs >= ${SL_MIN_VERSION}. Raise the pin in package.json."
            exit 1
          fi
          echo "sl ${have} (floor ${SL_MIN_VERSION})"

      # El registro de la plataforma. `sl cac` DERIVA la URL de cada provider
      # de `exports.<env>.URL` del descriptor de esa app, y para llegar al
      # descriptor necesita el registro: no lee `<PREFIJO>_URL` del entorno
      # como hacía el `cac` 1.6 (skylabs-cac.md §7). Mismo patrón y mismo
      # `path:` que el job `deploy`.
      - name: Token para leer el registro
        id: registry-token
        if: steps.stack.outputs.present == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          # SÓLO `infra` y SÓLO lectura: el repo propio ya se checkouteó con el
          # GITHUB_TOKEN. Sin `permission-contents: read` el token salía con
          # todos los permisos de la App — escritura en infra, cuyos rulesets
          # la App saltea —, y en `cac-plan` eso corre con el código del PR
          # (SEC-02). El checkout no lo deja en .git/config.
          repositories: infra

      - name: Checkout del registro (sparse)
        if: steps.stack.outputs.present == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          repository: skylabs-digital/infra
          path: .infra-registry
          sparse-checkout: registry
          token: ${{ steps.registry-token.outputs.token }}
      - name: yarn sl cac plan --env ${{ inputs.deploy-env }}
        if: steps.stack.outputs.present == 'true'
        env:
          IDACHU_URL: ${{ vars.IDACHU_URL }}
          NOTEN_URL: ${{ vars.NOTEN_URL }}
          FISTO_URL: ${{ vars.FISTO_URL }}
          IDACHU_CAC_KEY: ${{ inputs.deploy-env != 'prod' && secrets.IDACHU_CAC_KEY || '' }}
          IDACHU_CAC_KEY_PROD: ${{ inputs.deploy-env == 'prod' && secrets.IDACHU_CAC_KEY_PROD || '' }}
          SL_REGISTRY: ${{ github.workspace }}/.infra-registry/registry/apps.json
          DEPLOY_ENV: ${{ inputs.deploy-env }}
        run: |
          # `sl` collapses "plan with changes" and "plan with orphans" into the
          # same exit 2 (cli/src/cac/run.ts: "cualquier acción que no sea
          # `noop`, huérfanos incluidos"). The two are NOT the same thing here:
          #
          #   skylabs-cac.md §7 — "El `plan` en PR FALLA si hay `orphan` o
          #   rechazo."  A rejection is already exit 1. An orphan is a resource
          #   someone changed by hand outside CaC, and it must redden the PR.
          #
          #   skylabs-cli.md §3 — exit 2 is Terraform's `-detailed-exitcode`:
          #   "a plan with changes", which is NOT a failure.
          #
          # Both hold only if we stop reading the exit code and look at the
          # payload, so the plan is re-run with --json and `data.orphans`
          # decides. A plain diff stays green; an orphan fails and is NAMED.
          set +e
          yarn sl cac plan --env "${DEPLOY_ENV}"
          code=$?
          set -e
          [ "${code}" -ne 2 ] && exit "${code}"

          plan_json="$(SL_FORMAT=json yarn sl cac plan --env "${DEPLOY_ENV}" --json 2>/dev/null | tail -n 1)"

          # A guard that breaks quietly is worse than no guard. The type check is
          # the point: `.data.orphans | length` on a MISSING key is null|length
          # = 0, which jq -e accepts, so an envelope that ever stops carrying
          # `orphans` would wave every PR through green. Demanding an array
          # turns that into a loud failure instead.
          if ! orphans="$(printf '%s' "${plan_json}" \
              | jq -e -r 'if (.data.orphans | type) == "array" then (.data.orphans | length) else error("missing .data.orphans array") end' 2>/dev/null)"; then
            echo "::error::CaC plan exited 2 but its --json envelope could not be read (expected an array at .data.orphans), so orphans could not be ruled out. Fix this guard or read the plan by hand — do not merge on a green that means nothing."
            exit 1
          fi

          if [ "${orphans}" -gt 0 ]; then
            echo "::error::CaC plan for '${DEPLOY_ENV}': ${orphans} orphan(s) — declared nowhere in cac/stack.ts but alive with managed_by=cac, i.e. changed by hand. Re-declare them or remove them with --prune:"
            printf '%s' "${plan_json}" | jq -r '.data.orphans[] | "  - \(.provider) \(.kind) \(.name)"'
            exit 1
          fi

          echo "::warning::CaC plan for '${DEPLOY_ENV}' has changes (no orphans). Read the diff above before merging."
          exit 0

  cac-apply:
    name: CaC apply (${{ inputs.deploy-env }})
    needs: [version, deploy]
    # El caso de `deploy: false` se pregunta por el INPUT, no por
    # `needs.deploy.result == 'skipped'`. GitHub reporta `skipped` por dos
    # motivos distintos: el `if:` del job dio falso (que es lo que se quería
    # dejar pasar) Y el job no corrió porque alguno de sus `needs` FALLÓ
    # —`deploy` necesita `build-images` y `matrix`—. Con la condición vieja, un
    # build de imagen en rojo saltaba igual a `cac-apply` y movía el catálogo de
    # idachu/noten/fisto a una versión que nunca se construyó. Un deploy que
    # FALLÓ no entra: ahí lo último que se quiere es mover la configuración.
    # Bead sl-24x5.
    if: "!cancelled() && needs.version.outputs.bumped == 'true' && (needs.deploy.result == 'success' || inputs.deploy == false)"
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    # Talks to the providers with IDACHU_CAC_KEY; GITHUB_TOKEN only reads.
    permissions:
      contents: read
    timeout-minutes: 10
    environment: ${{ inputs.deploy-env }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: v${{ needs.version.outputs.version }}
      # Mismo motivo que en `cac-plan`: se decide antes de instalar y antes de
      # pedirle el registro a infra.
      - name: ¿Corre CaC en este repo?
        id: stack
        env:
          IDACHU_CAC_KEY: ${{ inputs.deploy-env != 'prod' && secrets.IDACHU_CAC_KEY || '' }}
          IDACHU_CAC_KEY_PROD: ${{ inputs.deploy-env == 'prod' && secrets.IDACHU_CAC_KEY_PROD || '' }}
          DEPLOY_ENV: ${{ inputs.deploy-env }}
        run: |
          # CAC-19: this job must not be able to decrypt deploy/secrets. With
          # the age key, `sl cac` would register sops values (rotate) from CI.
          if [ -n "${SOPS_AGE_KEY:-}" ]; then
            echo "::error title=CaC::SOPS_AGE_KEY is set in a CaC job: CI would register (rotate) API keys. See the comment on the CaC stage in app-release.yml."
            exit 1
          fi
          if [ ! -f cac/stack.ts ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No cac/stack.ts in this repo: CaC apply skipped."
          elif [ -z "${IDACHU_CAC_KEY}${IDACHU_CAC_KEY_PROD}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            key_name=IDACHU_CAC_KEY; [ "${DEPLOY_ENV}" = "prod" ] && key_name=IDACHU_CAC_KEY_PROD
            echo "::warning::${key_name} is not set in the '${DEPLOY_ENV}' environment: CaC apply skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - run: corepack enable
        if: steps.stack.outputs.present == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.stack.outputs.present == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        if: steps.stack.outputs.present == 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}

      # The `sl` this repo pins must be at least `sl-min-version` (DEP-08(3)).
      # Fixes land in `sl` (the checkout guard of 1.36, the key hashes of
      # 1.37) and reach no app until its pin moves; this is the lever that
      # makes a floor real. The default is today's fleet floor, so nothing
      # changes until the input (or the default) is raised.
      - name: sl version floor
        if: steps.stack.outputs.present == 'true'
        env:
          SL_MIN_VERSION: ${{ inputs.sl-min-version }}
        run: |
          set -euo pipefail
          pj="node_modules/@skylabs-digital/cli/package.json"
          if [ ! -f "$pj" ]; then
            echo "::error title=sl::@skylabs-digital/cli is not installed: add it to devDependencies (docs/standards/sl-en-los-repos.md)."
            exit 1
          fi
          have="$(node -p "require('./${pj}').version")"
          lowest="$(printf '%s\n%s\n' "$SL_MIN_VERSION" "$have" | sort -V | head -n1)"
          if [ "$lowest" != "$SL_MIN_VERSION" ]; then
            echo "::error title=sl too old::this repo pins @skylabs-digital/cli ${have}; the pipeline needs >= ${SL_MIN_VERSION}. Raise the pin in package.json."
            exit 1
          fi
          echo "sl ${have} (floor ${SL_MIN_VERSION})"

      # Mismo motivo y mismo patrón que en `cac-plan`: `sl cac` deriva la URL
      # del provider del descriptor, y para eso necesita el registro.
      - name: Token para leer el registro
        id: registry-token
        if: steps.stack.outputs.present == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          # SÓLO `infra` y SÓLO lectura: el repo propio ya se checkouteó con el
          # GITHUB_TOKEN. Sin `permission-contents: read` el token salía con
          # todos los permisos de la App — escritura en infra, cuyos rulesets
          # la App saltea —, y en `cac-plan` eso corre con el código del PR
          # (SEC-02). El checkout no lo deja en .git/config.
          repositories: infra

      - name: Checkout del registro (sparse)
        if: steps.stack.outputs.present == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          repository: skylabs-digital/infra
          path: .infra-registry
          sparse-checkout: registry
          token: ${{ steps.registry-token.outputs.token }}
      - name: yarn sl cac apply --env ${{ inputs.deploy-env }} --no-create-keys
        if: steps.stack.outputs.present == 'true'
        env:
          IDACHU_URL: ${{ vars.IDACHU_URL }}
          NOTEN_URL: ${{ vars.NOTEN_URL }}
          FISTO_URL: ${{ vars.FISTO_URL }}
          IDACHU_CAC_KEY: ${{ inputs.deploy-env != 'prod' && secrets.IDACHU_CAC_KEY || '' }}
          IDACHU_CAC_KEY_PROD: ${{ inputs.deploy-env == 'prod' && secrets.IDACHU_CAC_KEY_PROD || '' }}
          SL_REGISTRY: ${{ github.workspace }}/.infra-registry/registry/apps.json
          DEPLOY_ENV: ${{ inputs.deploy-env }}
        run: |
          # Exit 2 here means the apply worked but left orphans: resources the
          # stack no longer declares. It is a finding, not a failure, and this
          # job runs AFTER the deploy — reddening the release once the images
          # are already out would say "the release broke" about something that
          # did not. It annotates instead; the orphans get cleaned in a PR.
          set +e
          yarn sl cac apply --env "${DEPLOY_ENV}" --no-create-keys
          code=$?
          set -e
          if [ "${code}" -eq 2 ]; then
            echo "::warning::CaC apply for '${DEPLOY_ENV}' left orphans. Read the list above and clean them in a PR."
            exit 0
          fi
          exit "${code}"

  # ============================================================
  # STAGE 6 — SECRETS ROTATE — reacciona al alta/baja de un operador
  #
  # infra/.github/workflows/operators.yml manda un repository_dispatch
  # `skylabs-operators-changed` a cada app con `fragment: "app"` cuando cambia
  # `platform.operators` del registro (sin `client_payload`: la fuente es el
  # registro y se relee acá). Se re-cifran los deploy/secrets/*.env de ESTA app
  # para la lista nueva (`yarn sl secrets rotate`) y se commitea.
  #
  # Los VALORES no cambian: cambia para quién están cifrados. `sops updatekeys`
  # es idempotente, así que un segundo dispatch no hace daño.
  #
  # El caller tiene que declarar el trigger, y separar el `concurrency.group`
  # del evento (si no, un merge posterior a main cancela la rotación pendiente
  # en silencio — ver el README de este repo):
  #
  #   on:
  #     repository_dispatch:
  #       types: [skylabs-operators-changed]
  #   concurrency:
  #     group: release-${{ github.event_name == 'repository_dispatch' && 'secrets-rotate' || github.ref }}
  #     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  #
  # Es OBLIGATORIO para toda app con `fragment: "app"`: sin el trigger la app no
  # rota y nada lo avisa — `POST /repos/{owner}/{repo}/dispatches` devuelve 204
  # aunque ningún workflow escuche el evento.
  #
  # Un caller que NO lo declare sigue funcionando igual que hoy: este job es
  # inalcanzable sin el evento, y `matrix`/`static-checks`/`security`/`version`
  # no cambiaron para ningún otro evento.
  # ============================================================
  # La poda corre en ESTE repo, no en `.github`: su GITHUB_TOKEN alcanza los
  # paquetes que este repo publicó, y ninguna credencial de organización hace
  # falta. La versión centralizada nunca funcionó — ver la cabecera de
  # ghcr-retention.yml.
  #
  # Va después del deploy y no antes: recién ahí existe la imagen nueva y la
  # vieja pasa a ser podable. Y con las mismas condiciones que `cac-apply`, que
  # es el otro job que sólo tiene sentido tras un release verde.
  ghcr-retention:
    name: Poda de imágenes viejas (GHCR)
    needs: [version, matrix, deploy]
    if: "!cancelled() && needs.version.outputs.bumped == 'true' && (needs.deploy.result == 'success' || inputs.deploy == false)"
    uses: skylabs-digital/.github/.github/workflows/ghcr-retention.yml@main
    permissions:
      contents: read
      packages: write
    with:
      # Los nombres de imagen salen del descriptor, vía el mismo `sl app
      # services` que alimenta la matriz de build: lo que este repo construye es
      # exactamente lo que este repo puede podar.
      packages: ${{ toJson(fromJson(needs.matrix.outputs.services).*.name) }}
      dry-run: ${{ !inputs.prune-images }}

  secrets-rotate:
    name: Secrets rotate (recipients del registro)
    if: github.event_name == 'repository_dispatch' && github.event.action == 'skylabs-operators-changed'
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    timeout-minutes: 15
    # SIN `environment:`, a diferencia de `deploy`. `SOPS_AGE_KEY` es secret de
    # ORGANIZACIÓN (ver el bloque `secrets:` de arriba), así que un Environment
    # no cambia de dónde sale la llave: sólo agrega su deployment branch policy
    # y sus required reviewers. Una rotación de recipients no es un deploy —
    # con `environment: prod` la BAJA de un operador quedaría esperando la
    # aprobación de un humano, que es justo el evento que menos puede esperar.
    # `version`, que también commitea a la rama por defecto, tampoco lo usa.
    permissions:
      # El checkout y el push van con el token del App, no con el GITHUB_TOKEN:
      # `read` es el mínimo real.
      contents: read
    steps:
      # El GITHUB_TOKEN del reusable no puede pushear a una rama protegida ni
      # leer `infra` (privado). El App token del job `version` sí: es el mismo
      # que ya usa el bumper para commitear en main.
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          owner: ${{ github.repository_owner }}
          # SÓLO el repo propio, con contents:write: commitea y pushea los
          # recipients a su rama protegida. Antes era `<repo>,infra` con TODOS
          # los permisos de la App — escritura en infra, cuyos rulesets la App
          # saltea (SEC-02). El registro va con su propio token, abajo.
          repositories: ${{ github.event.repository.name }}

      - name: Token para leer el registro
        id: registry-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          permission-contents: read
          owner: ${{ github.repository_owner }}
          repositories: infra

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # La rama por defecto del repo de la app, no `main` hardcodeado: esto
          # es un reusable de flota. `fetch-depth: 0` porque el push reintenta
          # con `git pull --rebase` y un clone shallow no tiene sobre qué
          # rebasar.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Detect deploy/secrets
        id: secretos
        run: |
          set -euo pipefail
          if [ -d deploy/secrets ] && [ -f .sops.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Esta app todavía no tiene deploy/secrets/: nada que rotar."
          fi

      # Sólo el registro: un checkout sparse de infra, no el repo entero.
      # Mismo `path: .infra-registry` que el job `deploy`, para que el nombre no
      # dependa del job. Como en todos los checkouts del registro, con un token
      # de la App de SÓLO lectura sobre infra, y sin dejarlo en .git/config.
      - name: Checkout del registro de la plataforma
        if: steps.secretos.outputs.present == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/infra
          ref: main
          path: .infra-registry
          token: ${{ steps.registry-token.outputs.token }}
          sparse-checkout: registry
          sparse-checkout-cone-mode: true

      - run: corepack enable
        if: steps.secretos.outputs.present == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.secretos.outputs.present == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Install
        if: steps.secretos.outputs.present == 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GHCR_TOKEN }}

      - name: Install sops (pinned + checksum)
        # Mismo pin y mismo checksum que infra/.github/workflows/provision-env.yml.
        # Se baja en CADA job al $RUNNER_TEMP del job y se verifica siempre.
        # Antes vivía en $HOME/.local/bin, que sobrevive entre jobs en los
        # runners self-hosted: un sops plantado ahí por cualquier otro job del
        # pool quedaba en el PATH de un job con SOPS_AGE_KEY en el entorno, o
        # sea el binario que descifra prod (sl-zldd, SEC-03, DEP-02(3)). Un
        # $RUNNER_TEMP es del job y el runner lo vacía al terminar. No volver a
        # cachearlo en $HOME: son ~20 MB por job, y el ahorro no paga el riesgo.
        if: steps.secretos.outputs.present == 'true'
        run: |
          set -euo pipefail
          SOPS_VER=v3.11.0
          SOPS_SHA=775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef
          SOPS_DIR="${RUNNER_TEMP}/sops-${SOPS_VER}"
          mkdir -p "$SOPS_DIR"
          curl -sSfL -o "$SOPS_DIR/sops" "https://github.com/getsops/sops/releases/download/$SOPS_VER/sops-$SOPS_VER.linux.amd64"
          if ! echo "$SOPS_SHA  $SOPS_DIR/sops" | sha256sum -c - >/dev/null 2>&1; then
            echo "::error::the downloaded sops $SOPS_VER does NOT match the pinned checksum"
            rm -f "$SOPS_DIR/sops"
            exit 1
          fi
          chmod 0755 "$SOPS_DIR/sops"
          echo "$SOPS_DIR" >> "$GITHUB_PATH"

      # SOPS_AGE_KEY (identidad ci-github-actions, secret de organización)
      # entra SÓLO por env y sólo acá: `sl secrets rotate` la usa para
      # descifrar y volver a cifrar. Nada de `set -x` ni `echo` en este paso.
      - name: yarn sl secrets rotate
        if: steps.secretos.outputs.present == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SL_REGISTRY: ${{ github.workspace }}/.infra-registry/registry/apps.json
          SL_FORMAT: text
        run: |
          # Mismo chequeo que `cac-apply` hace con IDACHU_CAC_KEY, pero acá
          # FALLA en vez de saltear: sin la llave no hay rotación, y una baja de
          # operador que se saltea en silencio es un agujero abierto. Sin esta
          # guarda el run muere igual, pero con un error de sops — el peor lugar
          # posible para enterarse de que falta un secret.
          if [ -z "${SOPS_AGE_KEY}" ]; then
            echo "::error::SOPS_AGE_KEY no está disponible en este repo: la rotación de recipients no puede correr. Es un secret de organización — revisá que la org se lo comparta a este repositorio."
            exit 1
          fi
          yarn sl secrets rotate

      - name: Commit si hay cambios
        if: steps.secretos.outputs.present == 'true'
        env:
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          rm -rf .infra-registry
          # `git status --porcelain` y no `git diff --quiet`: `diff` sólo ve
          # archivos trackeados, así que un `.env` NUEVO bajo deploy/secrets/ no
          # se detectaría.
          if [ -z "$(git status --porcelain -- .sops.yaml deploy/secrets/)" ]; then
            echo "sin cambios de recipients"
            exit 0
          fi
          git config user.name "semantic-release-bot-skylabs[bot]"
          git config user.email "semantic-release-bot-skylabs[bot]@users.noreply.github.com"
          git add .sops.yaml deploy/secrets/
          # [skip ci]: esto no es un cambio de código y no tiene que disparar
          # un release ni un deploy.
          git commit -m "chore(secrets): recipients del registro [skip ci]"

          # Mismo patrón que el job `version`: 5 intentos, porque la rama por
          # defecto puede avanzar entre el checkout y el push. A diferencia del
          # bumper, acá el reintento SÍ puede rebasar: el commit toca
          # `.sops.yaml` y `deploy/secrets/`, que ningún otro job escribe, así
          # que no hay dos escrituras compitiendo por la misma línea. Si aun así
          # el rebase choca, se corta en rojo con la instrucción exacta: volver
          # a mandar el dispatch, que `sops updatekeys` es idempotente.
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${RAMA}"; then
              PUSHED=true
              break
            fi
            echo "Push intento ${attempt} rechazado — ${RAMA} avanzó mientras corría este job"
            if [ "$attempt" -lt 5 ]; then
              if ! git pull --rebase origin "${RAMA}"; then
                git rebase --abort || true
                echo "::error::El rebase sobre ${RAMA} falló: otro commit tocó los mismos secretos. Volvé a mandar el repository_dispatch skylabs-operators-changed para recalcular la rotación desde cero."
                exit 1
              fi
              sleep $((attempt * 2))
            fi
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::No se pudieron publicar los recipients nuevos después de 5 intentos (${RAMA} no dejó de moverse). Volvé a mandar el repository_dispatch skylabs-operators-changed: la rotación es idempotente."
            exit 1
          fi
