name: App Release (reusable)

# ============================================================================
# Reusable unified release pipeline for Skylabs Digital APPS (app-multi /
# app-single). One file, 5 stages, FULL-on-main / REDUCED-on-PR fork encoded
# ENTIRELY inside this reusable — callers only declare `on:` triggers and pass
# their service topology.
#
#   STAGE 1  static-checks   (every event: PR + push:main + schedule)
#   STAGE 1  security        (org reusable security.yml@v1 — every event)
#   STAGE 2  version         (push:main only — conventional-commit bumper)
#   STAGE 3  build-images    (needs version, bumped==true)
#   STAGE 4  image-scan       FOLDED INTO security.yml@v1 (Grype, push/sched only)
#   STAGE 5  deploy           (needs version + build, bumped==true)
#
# The fork point is the `version` job: `if: push && ref==main && !chore(release)`.
# On a PR, `version` never runs, so every build-*/deploy-* job (each
# `needs: [version]` + `if: needs.version.outputs.bumped == 'true'`) is
# structurally unreachable. PRs therefore get exactly static-checks + security
# (REDUCED); main push gets the whole chain (FULL).
#
# All third-party actions are SHA-pinned here so every consumer inherits the
# supply-chain hardening for free.
#
# ----------------------------------------------------------------------------
# HOW A CONSUMING REPO CALLS THIS (minimal caller `.github/workflows/release.yml`):
#
#   name: Release
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#     schedule:
#       - cron: '0 6 * * 1'
#   permissions:
#     contents: write
#     packages: write
#     id-token: write
#   jobs:
#     release:
#       uses: skylabs-digital/.github/.github/workflows/app-release.yml@main
#       with:
#         variant: app-multi
#         deploy-env: qa
#         smoke-base-url: https://qa.myapp.ar
#         services: |
#           [
#             {"name":"myapp-api","kind":"backend","dockerfile":"backend/Dockerfile","context":".","healthPath":"/api/health","hasMigrations":true},
#             {"name":"myapp-bo","kind":"static","dockerfile":"backoffice/Dockerfile","context":".","healthPath":"/bo/"},
#             {"name":"myapp-web","kind":"static","dockerfile":"frontend/Dockerfile","context":".","healthPath":"/"}
#           ]
#       secrets: inherit
#
# `services` is the SINGLE SOURCE OF TRUTH for build, deploy AND the security
# reusable's docker-images list. It no longer drives static-checks: that gate is
# repo-wide and runs once, independent of how many services a repo ships.
#
# `secrets: inherit` passes GHCR_TOKEN, SEMANTIC_RELEASE_APP_ID/_PRIVATE_KEY,
# DEPLOY_SSH_KEY and the org-level vars through automatically.
#
# ----------------------------------------------------------------------------
# CONTRACT WITH THE DOCKERFILES (release-versioning.md §4, adopted 2026-09-02):
#
# Every image in `services` is built with two build-args, guaranteed:
#
#   APP_VERSION=vX.Y.Z      the version the `version` job just computed and tagged
#   BUILD_COMMIT=<sha>      the exact main commit being built
#
# A Dockerfile that wants them declares `ARG APP_VERSION` / `ARG BUILD_COMMIT`
# and fixes them as `ENV`; one that does not declare them silently ignores them
# (docker only warns). Runtime code reads the version in this order, never from
# package.json in production:
#
#   APP_VERSION  ->  BUILD_COMMIT  ->  package.json "version"  ->  "unknown"
#
# The version job is the ONLY place the number is decided; the commit it writes
# to main is a mirror for humans and local dev, not the source (see §1-§3 of
# the standard). Canonical snippet: resuelto/backend/src/api/version.ts.
# ============================================================================

on:
  workflow_call:
    inputs:
      variant:
        description: 'app-multi | app-single (informational; topology is driven by `services`)'
        type: string
        default: app-multi
      node-version:
        description: 'Node version for static checks'
        type: string
        default: '24'
      services:
        description: >-
          JSON array of service objects. Each:
          {name, kind(backend|static|worker), dockerfile, context?(default "."),
           healthPath?, hasMigrations?(bool), smokeUrl?,
           restartsWorkers?(array of compose service names),
           restartsWorker?(compose service name)}. Single source of truth for
          build + deploy + security docker-images (NOT static-checks, which is
          repo-wide and runs once).
          `restartsWorkers`: compose services that reuse THIS service's image
          (command override, no image of their own) — each force-recreated with
          the freshly-deployed tag right after this service deploys. An app can
          run several processes off one image (an http server plus an outbox
          dispatcher plus a cron runner, say), and every one of them has to
          land on the new tag; refreshing only some leaves the rest silently
          rotting on an old image.
          `restartsWorker` is the singular alias kept for the callers written
          before the list existed. Both are honoured, and declaring both is
          fine — the union is recreated, each service only once.
        type: string
        required: true
      deploy-env:
        description: 'Deploy environment (maps to QA_PRIVATE_IP etc.)'
        type: string
        default: qa
      smoke-base-url:
        description: 'Base URL for post-deploy smoke tests (e.g. https://qa.myapp.ar)'
        type: string
        default: ''
      runner-labels:
        description: 'JSON array of runner labels'
        type: string
        default: '["self-hosted","linux","x64","skylabs"]'
    secrets:
      GHCR_TOKEN:
        description: 'Classic PAT (read:packages + write:packages) for private npm + GHCR/Droplet docker login'
        required: false
      SEMANTIC_RELEASE_APP_ID:
        description: 'GitHub App id for semantic-release-bot-skylabs (mints git-push token)'
        required: false
      SEMANTIC_RELEASE_PRIVATE_KEY:
        description: 'GitHub App private key matching SEMANTIC_RELEASE_APP_ID'
        required: false
      DEPLOY_SSH_KEY:
        description: 'SSH key for the deploy user on QA/Prod droplets'
        required: false
      IDACHU_CAC_KEY:
        description: >-
          CaC (skylabs/docs/standards/skylabs-cac.md §7-8): idachu PLATFORM key with
          idachu:cac + noten:cac, scoped per GitHub Environment (qa/prod). Only read
          when the repo has cac/stack.ts; absent → the CaC jobs skip with a warning.
        required: false

# husky must not run on the runner. Since the fleet moved hooks to
# `postinstall` (sl-06k), `yarn install` installs them in CI too — the checkout
# has a `.git` — and every git operation the workflow performs goes through
# them: semantic-release's `git commit` hits pre-commit/commit-msg and its
# `git push` runs the pre-push (a full `yarn ci`, duplicated). Measured on
# 2026-09-02: the extra minute inside the push is exactly the window in which
# a second merge to main lands and the push is rejected (menu-engine 16:04,
# react-proto-kit 16:23). CI is the gate here, not the hooks. See
# skylabs/docs/analyses/2026-09-02-revision-estabilidad-libs.md (sl-husky-en-ci).
env:
  HUSKY: 0

jobs:
  # ============================================================
  # STAGE 1 — STATIC CHECKS
  # `yarn ci` is the repo-wide gate: typecheck + lint + test + build across
  # every workspace. It runs ONCE. Until 2026-08-27 this was a matrix over
  # `services`, but `matrix.service` only ever reached the job NAME — never the
  # command — so every leg re-ran the identical repo-wide gate. Three services
  # meant three full copies per PR.
  #
  # That redundancy was not just waste, it was the failure. Node sizes its
  # old-space heap from the memory AVAILABLE AT STARTUP, so N copies of a
  # monorepo CI racing on one self-hosted runner means whichever leg starts last
  # gets a small heap and dies with "Ineffective mark-compacts near heap limit",
  # exit 129, before printing a line. Measured on resuelto (resuelto-5nw4): at
  # one commit, resuelto-api passed in 9m29s, resuelto-bo passed in 10m28s, and
  # resuelto-web died in 1m31s — same commit, same command, same code. A control
  # run on the last green commit had all three pass, so the runner is healthy;
  # the concurrency is what did not fit.
  #
  # BREAKING for consumers: this replaces N contexts named
  # "Static checks (<service>)" with a single "Static checks". Any ruleset that
  # requires the old strings by exact context will never see them again and will
  # block every PR until it is updated. Consumers track @main, so this lands on
  # all of them at once — deliberately, with the fleet owner's call.
  # ============================================================
  static-checks:
    if: github.actor != 'dependabot[bot]' && github.event_name != 'schedule'
    name: Static checks
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: CI (typecheck + lint + test + build)
        run: yarn ci

  # ============================================================
  # STAGE 1 — SECURITY (org reusable@v1) — also hosts STAGE 4 image-scan.
  # docker-images is derived from `services` (single source). OSV + Gitleaks
  # run on every event; Grype (image-scan) runs push/schedule only — gated
  # inside the reusable.
  # ============================================================
  security:
    name: Security (org reusable@v1)
    uses: skylabs-digital/.github/.github/workflows/security.yml@v1
    with:
      # `services` doubles as the Grype docker-images list. security.yml@v1
      # reads only {name, context, dockerfile} per entry and ignores the extra
      # kind/healthPath/hasMigrations keys, so we forward it verbatim.
      docker-images: ${{ inputs.services }}
    secrets:
      # Grype builds each image to scan it, which runs `yarn workspaces focus`
      # and pulls the private @skylabs-digital/* packages from GHCR npm. Use the
      # GHCR_TOKEN PAT (read:packages) for that. Do NOT forward app-id/private-key:
      # security.yml@v1 prefers an ephemeral GitHub App installation token over
      # npm-token, but that App token lacks read:packages → 403 Forbidden on the
      # private-package install (whole Grype matrix fails). The App token is only
      # needed by the version stage (commit/tag push), which mints its own.
      npm-token: ${{ secrets.GHCR_TOKEN }}

  # ============================================================
  # STAGE 2 — VERSION BUMP  (THE FORK POINT)
  # Bespoke conventional-commit shell bumper (semantic-release is libs-only).
  # Only runs on push:main and never on its own release commit, so the whole
  # build+deploy tail is unreachable on PR/non-main/schedule (= REDUCED run).
  # ============================================================
  version:
    name: Bump version & tag
    needs: [static-checks, security]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "semantic-release-bot-skylabs[bot]"
          git config user.email "semantic-release-bot-skylabs[bot]@users.noreply.github.com"

      - name: Bump version + tag + push
        id: bump
        run: |
          set -euo pipefail

          # Todo el calculo de la version -- desde LAST_TAG hasta el commit y
          # el tag -- vive en esta funcion para poder RECALCULARLO ENTERO en
          # cada intento del push, no solo reintentar el mismo commit. Un
          # `return 1` (sin marcar error: `set -e` no mata el script dentro de
          # un `if !`) senala que no hay nada liberable en el rango ACTUAL --
          # la misma salida limpia tanto si es el primer intento (push a main
          # sin commits liberables) como si es un intento posterior (un
          # release concurrente ya cubrio todo lo que este intento iba a
          # liberar).
          compute_release() {
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            RANGE=$([ -z "$LAST_TAG" ] && echo "" || echo "${LAST_TAG}..HEAD")

            # DOS vistas del rango, a proposito:
            #   %s -> un subject por linea, para leer type/scope/`!`
            #   %B -> el mensaje COMPLETO, unica forma de ver el footer
            SUBJECTS=$(git log ${RANGE} --pretty=format:'%s')
            BODIES=$(git log ${RANGE} --pretty=format:'%B')

            # major: CUALQUIER type, con o sin scope, seguido de `!:` — la
            # forma canonica de Conventional Commits 1.0.0. `[^)]+` y no `.*`
            # dentro del scope: `.*` es greedy y en un subject con mas de un
            # `)` se come el cierre y desalinea el patron. Las dos vistas del
            # rango (SUBJECTS/BODIES en vez de solo `--oneline`) son porque el
            # footer `BREAKING CHANGE:` solo aparece en `%B`; medido: idachu
            # ca3c4da (2026-08-29) quedo huerfano, resuelto 388ff5b7 y kommi
            # 7311c549 salieron como MINOR siendo breaking.
            if printf '%s\n' "$SUBJECTS" | grep -qiE '^[a-z]+(\([^)]+\))?!:' \
              || printf '%s\n' "$BODIES" | grep -qE '^BREAKING[ -]CHANGE:'; then
              BUMP=major
            elif printf '%s\n' "$SUBJECTS" | grep -qiE '^feat(\([^)]+\))?:'; then
              BUMP=minor
            elif printf '%s\n' "$SUBJECTS" | grep -qiE '^(fix|perf|refactor)(\([^)]+\))?:'; then
              BUMP=patch
            else
              return 1
            fi

            CURRENT=$(node -p "require('./package.json').version")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW="${MAJOR}.${MINOR}.${PATCH}"

            # Tag-collision guard: keep bumping patch until a free slot is found.
            git fetch --tags --force --quiet origin || true
            while git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null 2>&1 \
               || git ls-remote --exit-code --tags origin "refs/tags/v${NEW}" >/dev/null 2>&1; do
              echo "Tag v${NEW} already exists — bumping patch"
              PATCH=$((PATCH + 1))
              NEW="${MAJOR}.${MINOR}.${PATCH}"
            done

            echo "Bumping: ${CURRENT} → ${NEW} (${BUMP})"

            # Bump every package.json found (root + workspaces), shallow scan.
            for pj in package.json */package.json; do
              [ -f "$pj" ] || continue
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$pj','utf8'));if(p.version){p.version='$NEW';fs.writeFileSync('$pj',JSON.stringify(p,null,2)+'\n');}"
            done

            DATE=$(date +%Y-%m-%d)
            if [ -z "$LAST_TAG" ]; then
              RANGE_COMMITS=$(git log --oneline --pretty=format:"- %s (%h)")
            else
              RANGE_COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --pretty=format:"- %s (%h)")
            fi
            ENTRY="## [${NEW}] - ${DATE}\n\n${RANGE_COMMITS}\n"
            if [ -f CHANGELOG.md ]; then
              echo -e "# Changelog\n\n${ENTRY}\n$(tail -n +2 CHANGELOG.md)" > CHANGELOG.md
            else
              echo -e "# Changelog\n\n${ENTRY}" > CHANGELOG.md
            fi

            git add -A
            git commit -m "chore(release): v${NEW} [skip ci]"
            # `-f`: un reintento puede dejar un tag LOCAL del intento anterior
            # con el mismo nombre, si el rango no cambio entre intentos.
            git tag -f -a "v${NEW}" -m "Release v${NEW}"
          }

          # Escribe la salida "no hay nada que liberar" — mismo shape en los
          # dos casos que la producen (ver mas abajo), solo cambia el motivo.
          no_releasable_commits() {
            local reason="$1"
            echo "::warning::${reason}"
            {
              echo "### Sin release"
              echo ""
              echo "${reason}"
              if [ -n "$SUBJECTS" ]; then
                echo ""
                echo "Subjects evaluados en el rango \`${LAST_TAG:-inicio}..HEAD\`:"
                echo ""
                printf '%s\n' "$SUBJECTS" | sed 's/^/- /'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          }

          # Push el commit de release y su tag ATOMICAMENTE. Si lo rechazan
          # porque `main` se movio, NO se reintenta rebasando el MISMO commit:
          # se descarta, se refresca `origin/main`, y se RECALCULA la version
          # entera desde cero contra la base real.
          #
          # Por que. Dos releases que arrancan casi juntos parten del mismo
          # `CURRENT` y terminan tocando las MISMAS lineas de version en
          # `package.json`/`CHANGELOG.md` con contenido DISTINTO —
          # `3.3.1→3.3.2` en uno, `3.3.1→3.3.3` en el otro. Un rebase no puede
          # fusionar eso nunca, por diseño: son dos parches sobre la identica
          # linea, no un conflicto que un merge de tres vias pueda resolver.
          # La version anterior de este script reintentaba con `git rebase
          # origin/main`, que en ESTE caso exacto siempre aborta con
          # conflicto y tira el release entero a resolucion manual —
          # observado en idachu, PR #103 vs #101 mergeados con ~6 minutos de
          # diferencia (2026-08-31, run 33395817764) — aunque el commit
          # concurrente ya hubiera liberado TODO lo que este intento iba a
          # liberar. El guard de colision de tags de `compute_release` solo
          # evita nombres de tag repetidos: no se entera de que el archivo
          # que esta por commitear ya lo toco el release concurrente.
          #
          # Recalcular desde `origin/main` fresco convierte el caso comun (el
          # concurrente ya libero todo esto) en un no-op limpio —
          # `compute_release` devuelve 1 porque el rango `LAST_TAG..HEAD` ya
          # no tiene nada liberable — y el caso raro (el concurrente liberaba
          # ALGO pero no todo) en un bump correcto sobre la base real, en vez
          # de un commit corrupto o un conflicto que bloquea el pipeline.
          PUSHED=false
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "Intento ${attempt}: descartando el commit de release anterior y recalculando contra origin/main"
              git fetch --quiet origin main
              git reset --hard origin/main
              # El tag LOCAL del intento anterior sobrevive al reset (`reset
              # --hard` solo mueve la rama y el working tree) y confundiria al
              # guard de colision de `compute_release`, que lo veria como si
              # ya estuviera publicado y saltearia una version de mas.
              [ -n "${NEW:-}" ] && git tag -d "v${NEW}" >/dev/null 2>&1 || true
            fi

            if ! compute_release; then
              if [ "$attempt" -eq 1 ]; then
                no_releasable_commits "Push a main sin commits liberables: NO se construyo ni desplego nada. Liberan: feat / fix / perf / refactor, y cualquier type con '!' o con footer 'BREAKING CHANGE:'."
              else
                no_releasable_commits "Un release concurrente ya cubrio todo lo que este intento iba a liberar: NO se construyo ni desplego nada de mas."
              fi
              exit 0
            fi

            if git push --atomic origin HEAD:main "refs/tags/v${NEW}"; then
              PUSHED=true
              break
            fi
            echo "Push intento ${attempt} rechazado — main avanzo mientras corria este job"
            sleep $((attempt * 2))
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::No se pudo publicar el release v${NEW} despues de 5 intentos (main no dejo de moverse)."
            exit 1
          fi

          echo "bumped=true" >> $GITHUB_OUTPUT
          echo "version=${NEW}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.bump.outputs.bumped == 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v2.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          body_path: CHANGELOG.md
          generate_release_notes: true

  # ============================================================
  # STAGE 3 — BUILD IMAGES
  # One matrix entry per service. Pushes vN + sha + latest to GHCR.
  # Unreachable on PR (needs version, which never runs there).
  # ============================================================
  build-images:
    name: Build image (${{ matrix.service.name }})
    needs: [version]
    if: needs.version.outputs.bumped == 'true'
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.services) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v3.11.1
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v6.18.0
        with:
          context: ${{ matrix.service.context || '.' }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:v${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:latest
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            APP_VERSION=v${{ needs.version.outputs.version }}
          secrets: |
            npm_token=${{ secrets.GHCR_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

  # ============================================================
  # STAGE 5 — DEPLOY
  # One matrix entry per service. Backend services with hasMigrations run a
  # `db:migrate:plan` dry-run, then apply via the isolated `migrator` compose
  # service, before deploy. Smoke test + qa-stable tag + rollback on failure.
  # Unreachable on PR. Prod is a separate, manually-approved path (not here).
  # ============================================================
  deploy:
    name: Deploy (${{ matrix.service.name }})
    needs: [version, build-images]
    if: needs.version.outputs.bumped == 'true'
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    environment: ${{ inputs.deploy-env }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJson(inputs.services) }}
    env:
      REGISTRY: ghcr.io
      SERVICE_NAME: ${{ matrix.service.name }}
      IMAGE_NAME: ${{ github.repository_owner }}/${{ matrix.service.name }}
      TAG: v${{ needs.version.outputs.version }}
      DEPLOY_ENV: ${{ inputs.deploy-env }}
      # Optional: worker compose services that reuse THIS service's image
      # (command override, no image of their own). Empty for services that
      # don't declare them; the "Restart workers" step is gated on the union.
      # The `&&/||` guard is deliberate over a bare `join(...)`: if `join` on an
      # absent key did NOT yield '', the expression would break every service
      # in the fleet that omits the key, not just the ones using it. Cheap
      # insurance on a shared reusable.
      RESTARTS_WORKERS: ${{ matrix.service.restartsWorkers && join(matrix.service.restartsWorkers, ' ') || '' }}
      RESTARTS_WORKER: ${{ matrix.service.restartsWorker }}
    steps:
      - name: Apply migrations (isolated migrator)
        # Apply committed migrations via the isolated one-shot <app>-migrator
        # compose service, using the COMPILED migrator in the prod image
        # (db:migrate:deploy = node dist/...). We do NOT run db:migrate:plan
        # here: that script is tsx/drizzle-kit based and the prod runtime image
        # excludes those by design (CVE remediation), so it is absent in the
        # deployed container (`Command "db:migrate:plan" not found`). The
        # migration consistency check belongs at build time (static-checks),
        # not against the prod image. Runs only for services with hasMigrations.
        if: ${{ matrix.service.hasMigrations }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ vars.QA_PRIVATE_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_host: ${{ vars.BASTION_HOST }}
          proxy_port: ${{ vars.BASTION_SSH_PORT }}
          proxy_username: deploy
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,TAG,DEPLOY_ENV,SERVICE_NAME
          script: |
            set -e
            cd /opt/skylabs
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ${REGISTRY}/${IMAGE_NAME}:${TAG}
            # --env-file is REQUIRED for ${<APP>_DATABASE_URL} interpolation in
            # the compose `environment:` blocks — without it the migrator gets an
            # empty DATABASE_URL and fails with "no such database: postgres".
            # deploy-service.sh injects env the same way (scripts/deploy-service.sh).
            COMPOSE="docker compose --env-file /opt/skylabs/.env -f compose.yml -f compose.${DEPLOY_ENV}.yml"
            APP="${SERVICE_NAME%-*}"
            MIGRATOR="${APP}-migrator"
            # The migrator service image is pinned to ${<APP>_API_TAG:-latest}.
            # Export the freshly-built tag so the migrator runs the NEW image
            # (which contains db:migrate:deploy) instead of a stale :latest —
            # otherwise: `Command "db:migrate:deploy" not found`.
            TAG_VAR="$(printf '%s' "$APP" | tr '[:lower:]-' '[:upper:]_')_API_TAG"
            echo "== Applying migrations (${MIGRATOR} @ ${TAG}) =="
            # Run the migrator service's OWN command (a compiled `node dist/...`
            # entrypoint declared in compose). Do NOT force `yarn db:migrate:deploy`:
            # node-only runtime images (no corepack) can't run yarn, and the base
            # image's stale yarn collides with packageManager. node-direct is
            # yarn-independent and matches the node-only-runtime CVE-isolation rule.
            env "${TAG_VAR}=${TAG}" ${COMPOSE} run --rm "${MIGRATOR}"

      - name: Deploy service
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ vars.QA_PRIVATE_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_host: ${{ vars.BASTION_HOST }}
          proxy_port: ${{ vars.BASTION_SSH_PORT }}
          proxy_username: deploy
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,SERVICE_NAME,TAG,DEPLOY_ENV
          script: |
            set -e
            cd /opt/skylabs
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ${REGISTRY}/${IMAGE_NAME}:${TAG}
            /opt/skylabs/scripts/deploy-service.sh ${DEPLOY_ENV} ${SERVICE_NAME} --tag ${TAG}

      - name: Restart workers (shared image)
        id: worker
        # A worker service that reuses THIS backend's image (command override, no
        # image of its own) is NOT a deploy-matrix entry, so the per-service
        # deploy above never touches it. When the service declares
        # `restartsWorkers` (or the singular `restartsWorker`), force-recreate
        # those compose services with the SAME freshly-deployed tag so they run
        # the new code too. Without this a worker silently rots on a stale image
        # while the api updates every release (observed in resuelto: month-old
        # worker → Notification Engine "Missing variable" render failures
        # because the worker's payload lagged the template).
        # Runs only when at least one of the two keys is set.
        if: ${{ (matrix.service.restartsWorkers && join(matrix.service.restartsWorkers, ' ') != '') || (matrix.service.restartsWorker != '' && matrix.service.restartsWorker != null) }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ vars.QA_PRIVATE_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_host: ${{ vars.BASTION_HOST }}
          proxy_port: ${{ vars.BASTION_SSH_PORT }}
          proxy_username: deploy
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SERVICE_NAME,TAG,DEPLOY_ENV,RESTARTS_WORKERS,RESTARTS_WORKER
          script: |
            set -e
            cd /opt/skylabs
            # The worker's compose image is pinned to ${<APP>_API_TAG:-latest}
            # (same var the isolated migrator uses). Export the freshly-deployed
            # tag so `up -d --force-recreate` lands the worker on the NEW image.
            # --env-file is REQUIRED so ${<APP>_*} interpolate in the worker's
            # compose `environment:` block (mirrors the migrator step above).
            # NO `|| true`: a failed recreate MUST fail the deploy (→ rollback),
            # never silently leave a worker on stale code (that footgun is the
            # whole reason this step exists). The loop keeps that property: the
            # first failure exits non-zero under `set -e`, so a later worker
            # recreating fine can never mask an earlier one that did not.
            COMPOSE="docker compose --env-file /opt/skylabs/.env -f compose.yml -f compose.${DEPLOY_ENV}.yml"
            APP="${SERVICE_NAME%-*}"
            TAG_VAR="$(printf '%s' "$APP" | tr '[:lower:]-' '[:upper:]_')_API_TAG"
            # Union of the list and the singular alias. Unquoted on purpose:
            # word splitting is what turns the space-joined list back into
            # arguments, and compose service names have no spaces.
            SEEN=""
            for WORKER in ${RESTARTS_WORKERS:-} ${RESTARTS_WORKER:-}; do
              # Dedupe, so declaring both keys does not recreate one twice.
              case " ${SEEN} " in *" ${WORKER} "*) continue ;; esac
              SEEN="${SEEN} ${WORKER}"
              echo "== Recreating worker ${WORKER} @ ${TAG} (via ${TAG_VAR}) =="
              env "${TAG_VAR}=${TAG}" ${COMPOSE} up -d --no-deps --force-recreate "${WORKER}"
              # Observability: surface the image the worker now runs so drift is
              # visible straight from the deploy log. Never fails the step.
              WORKER_CID=$(${COMPOSE} ps -q "${WORKER}" 2>/dev/null || true)
              if [ -n "${WORKER_CID}" ]; then
                echo "Worker ${WORKER} now running image: $(docker inspect --format '{{.Config.Image}}' "${WORKER_CID}" 2>/dev/null || echo unknown)"
              else
                echo "::warning::Could not resolve container id for ${WORKER} after recreate"
              fi
            done

      - name: Smoke test
        id: smoke
        # Per-service smoke URL for multi-host apps: a service served on a
        # different host than smoke-base-url (e.g. a backoffice/web on its own
        # domain vs the api host) sets its own `smokeUrl`. Fall back to
        # `smoke-base-url + healthPath`; skip when neither is resolvable rather
        # than curling the wrong host (which 404s and fails the deploy).
        run: |
          SMOKE_URL="${{ matrix.service.smokeUrl }}"
          if [ -z "$SMOKE_URL" ] && [ -n "${{ inputs.smoke-base-url }}" ] && [ -n "${{ matrix.service.healthPath }}" ]; then
            SMOKE_URL="${{ inputs.smoke-base-url }}${{ matrix.service.healthPath }}"
          fi
          if [ -z "$SMOKE_URL" ]; then
            echo "No smoke URL for ${{ matrix.service.name }} — skipping smoke test"
            exit 0
          fi
          sleep 12
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$SMOKE_URL")
          echo "Smoke: $SMOKE_URL -> HTTP ${STATUS}"
          [ "$STATUS" = "200" ] || { echo "::error::Smoke test failed (HTTP ${STATUS})"; exit 1; }

      # Sella el tag como last-good en el droplet — el ÚNICO camino que mueve
      # /opt/skylabs/.last-good-tags (infra: spec deploy-reliability §2.2). El
      # healthcheck interno del deploy NO promueve: entre el health verde y este
      # punto el tag es candidato; recién con el smoke externo verde es "bueno".
      # El rollback de deploy-service.sh restaura SIEMPRE desde last-good.
      - name: Promote to last-good
        if: success()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ vars.QA_PRIVATE_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_host: ${{ vars.BASTION_HOST }}
          proxy_port: ${{ vars.BASTION_SSH_PORT }}
          proxy_username: deploy
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SERVICE_NAME,DEPLOY_ENV
          script: |
            set -e
            /opt/skylabs/scripts/deploy-service.sh ${DEPLOY_ENV} ${SERVICE_NAME} --promote

      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag as ${{ inputs.deploy-env }}-stable
        if: success()
        run: |
          set -e
          docker pull ghcr.io/${IMAGE_NAME}:${TAG}
          docker tag ghcr.io/${IMAGE_NAME}:${TAG} ghcr.io/${IMAGE_NAME}:${DEPLOY_ENV}-stable
          docker push ghcr.io/${IMAGE_NAME}:${DEPLOY_ENV}-stable

      # Solo si el servicio fue TOCADO y quedó mal: deploy, worker o smoke en
      # rojo. Un fallo previo (migraciones, GHCR) no debe "rollbackear" un
      # servicio que sigue corriendo la versión anterior sana — y con
      # last-good como fuente, un rollback de más re-desplegaría un tag viejo.
      - name: Rollback on failure
        if: failure() && (steps.deploy.outcome == 'failure' || steps.worker.outcome == 'failure' || steps.smoke.outcome == 'failure')
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ vars.QA_PRIVATE_IP }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          proxy_host: ${{ vars.BASTION_HOST }}
          proxy_port: ${{ vars.BASTION_SSH_PORT }}
          proxy_username: deploy
          proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SERVICE_NAME,DEPLOY_ENV
          script: |
            set -e
            cd /opt/skylabs
            /opt/skylabs/scripts/deploy-service.sh ${DEPLOY_ENV} ${SERVICE_NAME} --rollback

  # ============================================================
  # STAGE 5 — CaC (configuration as code)
  # skylabs/docs/standards/skylabs-cac.md §7. Opt-in by presence of
  # `cac/stack.ts` in the repo: nothing changes for repos without it.
  #
  # PR   → `yarn cac plan --env <deploy-env>`: the diff against the platform
  #        catalog, exit 1 on orphans/rejections so the PR shows drift.
  # main → `yarn cac apply --env <deploy-env> --no-create-keys`, after the
  #        migrations and the deploy of every service: the code is live before
  #        the catalog (roles, flags, templates) is aligned to it. Keys are
  #        created by a person (a local apply), never by CI.
  #
  # Credentials come from the GitHub Environment named after deploy-env:
  # vars IDACHU_URL / NOTEN_URL and secret IDACHU_CAC_KEY (an idachu PLATFORM
  # key with idachu:cac + noten:cac). noten has no key of its own — the CLI
  # exchanges IDACHU_CAC_KEY for a service token (service-identity.md §4).
  # Without the secret the job warns and exits 0, so a repo can adopt the
  # stack before the org has minted the key.
  # ============================================================
  cac-plan:
    name: CaC plan (${{ inputs.deploy-env }})
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: static-checks
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    environment: ${{ inputs.deploy-env }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Detect cac/stack.ts
        id: stack
        run: |
          if [ -f cac/stack.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No cac/stack.ts in this repo: CaC plan skipped."
          fi
      - run: corepack enable
        if: steps.stack.outputs.present == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.stack.outputs.present == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        if: steps.stack.outputs.present == 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: yarn cac plan --env ${{ inputs.deploy-env }}
        if: steps.stack.outputs.present == 'true'
        env:
          IDACHU_URL: ${{ vars.IDACHU_URL }}
          NOTEN_URL: ${{ vars.NOTEN_URL }}
          IDACHU_CAC_KEY: ${{ secrets.IDACHU_CAC_KEY }}
        run: |
          if [ -z "${IDACHU_CAC_KEY}" ]; then
            echo "::warning::IDACHU_CAC_KEY is not set in the '${{ inputs.deploy-env }}' environment: CaC plan skipped."
            exit 0
          fi
          yarn cac plan --env "${{ inputs.deploy-env }}"

  cac-apply:
    name: CaC apply (${{ inputs.deploy-env }})
    needs: [version, deploy]
    if: needs.version.outputs.bumped == 'true'
    runs-on: ${{ fromJson(inputs.runner-labels) }}
    environment: ${{ inputs.deploy-env }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Detect cac/stack.ts
        id: stack
        run: |
          if [ -f cac/stack.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No cac/stack.ts in this repo: CaC apply skipped."
          fi
      - run: corepack enable
        if: steps.stack.outputs.present == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        if: steps.stack.outputs.present == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Install
        if: steps.stack.outputs.present == 'true'
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: yarn cac apply --env ${{ inputs.deploy-env }} --no-create-keys
        if: steps.stack.outputs.present == 'true'
        env:
          IDACHU_URL: ${{ vars.IDACHU_URL }}
          NOTEN_URL: ${{ vars.NOTEN_URL }}
          IDACHU_CAC_KEY: ${{ secrets.IDACHU_CAC_KEY }}
        run: |
          if [ -z "${IDACHU_CAC_KEY}" ]; then
            echo "::warning::IDACHU_CAC_KEY is not set in the '${{ inputs.deploy-env }}' environment: CaC apply skipped."
            exit 0
          fi
          yarn cac apply --env "${{ inputs.deploy-env }}" --no-create-keys
