# ──────────────────────────────────────────────
# GHCR retention — se conservan los últimos N releases por paquete
#
# La org tiene 27 paquetes de contenedor y NUNCA se borró una versión: 2.787 al
# escribir esto (resuelto-api sola tiene 444, la más vieja del 30 de junio).
# Las imágenes de backend pesan 70-119 MB y las de frontend 20-24 MB: son
# decenas de GB que crecen con cada release. Los runners self-hosted no ayudan
# acá — ahorran minutos de cómputo, no almacenamiento; los bytes viven en
# GitHub igual.
#
# Las PRs NO construyen imágenes (el job `build-images` de app-release.yml
# exige `needs.version.outputs.bumped == 'true'`), así que no hay basura de PR
# que barrer: cada versión de GHCR es un release real, con sus tres tags
# (`v<version>`, el `<sha>` y `latest`).
#
# ── LA REGLA ──────────────────────────────────
#
# Se borra toda versión SALVO:
#   (a) las últimas N por fecha de creación (N = `keep`, default 3), y
#   (b) cualquiera que lleve un TAG DE ENTORNO: `latest`, `stable` (el canal de
#       prod) o `<env>-stable` (`qa-stable`, `monitor-stable`).
#
# (b) es lo que hace que el borrado sea seguro POR DISEÑO, y no por confiar en
# que los entornos estén al día. Prod y QA comparten el mismo repositorio de
# imágenes: si QA hace diez releases mientras prod se queda atrás, borrar por
# cantidad elimina la imagen que prod está corriendo, y no se nota hasta el día
# que haya que recrear el contenedor, rebuildear el host o hacer un rollback.
# No es hipotético — al escribir esto:
#
#   noten-api     prod corre v1.24.0 (2026-07-23), 55 releases atrás
#   resuelto-api  prod corre v2.19.0 (2026-07-24), ~90 releases atrás
#   idachu-api    prod corre v1.1.0  (2026-07-04)
#
# Las tres sobreviven sólo por su tag `stable`. Este workflow no sabe nada de
# droplets ni de despliegues: lee tags, y quien despliega es quien los pone.
#
# Corolario de (b): un paquete donde NINGUNA versión lleva tag de entorno no se
# toca. Ahí (b) no existe, y el estado tiene dos lecturas indistinguibles desde
# acá — nunca se desplegó, o el tagueo (best-effort) viene fallando callado. Se
# saltea con un `::warning::` que lo nombra y lo decide una persona. El resumen
# lleva la cuenta de salteados: si sube, es el canario de que el tagueo se
# rompió. Hoy son tres, los tres legacy sin fragmento de compose que los
# referencie: kommi-frontend, loving.wedding/frontend y loving.wedding/backend.
#
# Los tags de entorno los pushean dos lugares, a propósito los dos:
#   - app-release.yml, paso "Tag as <deploy-env>-stable", tras un deploy de
#     release verde;
#   - infra/scripts/deploy-service.sh (`tag_env_channel`), desde el droplet,
#     después del healthcheck y del smoke — el único camino que cubre también
#     el deploy a mano y el del dashboard.
#
# ── POR QUÉ NO `actions/delete-package-versions` ──
#
# Su input `ignore-versions` es una regex sobre el NOMBRE de la versión, y para
# un paquete de contenedor el nombre es el digest (`sha256:46f9303b…`), no los
# tags. O sea que no puede expresar la condición (b), que es justamente la que
# hace seguro el borrado. El resto de la action (contar y borrar) es trivial
# con `gh api`; la parte que no sabe hacer es la que importa.
#
# ── PERMISOS: por qué esto corre en CADA REPO y no acá ──
#
# Hasta 2026-09-16 este workflow corría centralizado en `.github`, con el token
# de la App de la org, y NUNCA funcionó: fallaba en su preflight. El mensaje de
# error culpaba a un permiso faltante y mandaba a otorgar **Packages: write** a
# la App — que ya lo tenía. El diagnóstico correcto es otro:
#
#   `packages` es un permiso de REPOSITORIO; `/orgs/{org}/packages` es un
#   endpoint de ORGANIZACIÓN. Un installation token no lo alcanza, tenga el
#   permiso o no.
#
# Verificado por diferencia: un PAT clásico lista los paquetes de la org sin
# problema; el token de la App no, con `packages: write` puesto.
#
# ── LO QUE SÍ FUNCIONA, medido ──
#
# Los 27 paquetes de contenedor están LIGADOS a su repo (`.repository.name` no
# es null en ninguno), y GitHub otorga el rol `admin` sobre un paquete al repo
# cuyo workflow lo publicó — que es exactamente nuestro caso, porque las
# imágenes las construye `build-images` de app-release.yml en cada repo.
#
# La documentación de GitHub dice las dos cosas, y se contradice:
#
#   docs/rest/packages         "OAuth app tokens and personal access tokens
#                              (classic) need the read:packages scope" — no
#                              menciona GITHUB_TOKEN.
#   docs/packages/deleting-…   "If your workflow publishes a package, the
#                              `admin` role is granted by default to the
#                              repository where the workflow is stored."
#
# Manda la segunda. Probado el 2026-09-16 con un workflow de sólo lectura en
# fisto (rama temporal, ya borrada), con `permissions: packages: write`:
#
#   GET /orgs/skylabs-digital/packages/container/fisto-api/versions
#   → HTTP/2.0 200 OK, tres versiones con sus tags
#
# Por eso este archivo es un `workflow_call`: corriendo en el contexto del repo
# que llama, su `GITHUB_TOKEN` alcanza sus propios paquetes. Sin App, sin PAT y
# sin secreto de organización — que además es lo que permite bajar
# SEMANTIC_RELEASE_* a `visibility: private`, del que `.github` (el único repo
# PÚBLICO de la org) quedaría afuera.
#
# ── CÓMO SE SABE QUÉ PAQUETES SON MÍOS ──
#
# No por la API: leído con `GITHUB_TOKEN`, `.repository` del paquete vuelve
# `null` (medido en la misma prueba), así que no se puede descubrir la
# pertenencia desde acá. Los nombres llegan por el input `packages`, que
# app-release.yml arma con la salida de `sl app services` — el descriptor del
# repo, que es la fuente de verdad de qué imágenes construye.
#
# COROLARIO, y es una limitación real: un paquete que ya no está en el
# descriptor NO lo alcanza nadie. Al 2026-09-16 hay cinco así, con 136
# versiones entre todos:
#
#   ns-api                    83 versiones, última 2026-03-19
#   ns-bo                     35 versiones, última 2026-03-17
#   kommi-frontend            12 versiones, última 2026-04-07
#   loving.wedding/backend     3 versiones, última 2026-08-31
#   loving.wedding/frontend    3 versiones, última 2026-08-31
#
# Esos no son un problema de retención sino de borrado entero, una sola vez, a
# mano y por una persona. Ver
# skylabs/docs/runbooks/apps-y-credenciales-de-la-org.md §4.

on:
  workflow_call:
    inputs:
      packages:
        description: 'JSON array con los nombres de paquete a podar. Lo arma app-release.yml desde `sl app services`.'
        required: true
        type: string
      dry-run:
        description: 'Sólo imprimir el plan, sin borrar nada.'
        type: boolean
        default: true
      keep:
        description: 'Cuántas versiones conservar por fecha, además de las que lleven tag de entorno.'
        type: string
        default: '3'
      max-deletes:
        description: 'Cota de borrados por corrida (la próxima sigue donde quedó). 0 = sin cota.'
        type: string
        default: '500'

# NO hay `schedule` ni `workflow_dispatch` acá a propósito: un disparador en
# este repo correría en el contexto de `.github`, cuyo GITHUB_TOKEN no alcanza
# los paquetes de los otros repos — que es exactamente por qué la versión
# centralizada nunca funcionó. El disparador vive en el repo dueño de las
# imágenes: app-release.yml llama a este reusable tras un release verde.

permissions:
  contents: read

concurrency:
  group: ghcr-retention-${{ github.repository }}
  cancel-in-progress: false

jobs:
  retention:
    name: Poda de imágenes viejas (GHCR)
    # Runner efímero a propósito: este job sólo habla con la API de GitHub. No
    # necesita el pool self-hosted (que es un host persistente compartido con
    # provision-env, operators y el deploy de prod), y corriendo en el repo de
    # cada app tampoco sostiene ya ninguna credencial de organización.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Lo único que hace falta. `GITHUB_TOKEN` con este permiso alcanza los
      # paquetes LIGADOS a este repo, que son los que este repo publicó.
      packages: write
    steps:
      # Prueba la operación REAL sobre el primer paquete, no una operación
      # parecida: el modo de falla que importa es un 403 a mitad del borrado,
      # con parte del plan aplicado. Y si falla, dice qué se pidió y qué
      # devolvió — no manda a cambiar un permiso.
      - name: Preflight — este repo puede leer las versiones de sus paquetes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          set -uo pipefail

          first=$(printf '%s' "${PACKAGES}" | jq -r '.[0] // empty')
          if [ -z "${first}" ]; then
            echo "::error::El input \`packages\` vino vacío. app-release.yml lo arma desde \`sl app services\`; si este repo no declara servicios, no debería estar llamando a este reusable."
            exit 1
          fi

          enc=$(printf '%s' "${first}" | sed 's|/|%2F|g')
          path="/orgs/${ORG}/packages/container/${enc}/versions?per_page=1"

          if out=$(gh api "${path}" 2>&1); then
            echo "OK — este repo lee las versiones de sus paquetes."
            echo "  probado: GET ${path}"
            exit 0
          fi

          echo "::error::No se pudieron leer las versiones de ${first}."
          {
            echo "Se pidió:   GET ${path}"
            echo "Se usó:     GITHUB_TOKEN de ${GITHUB_REPOSITORY} con permissions.packages=write"
            echo "Devolvió:"
            printf '%s\n' "${out}" | sed 's/^/  /'
            echo ""
            echo "Qué significa: GitHub otorga el rol \`admin\` sobre un paquete al repo"
            echo "cuyo workflow lo publicó. Si esta llamada da 403 o 404, este repo NO"
            echo "tiene ese rol sobre ${first} — o el paquete lo publicó otra cosa, o"
            echo "el vínculo paquete↔repo se perdió."
            echo ""
            echo "NO es un permiso de la App ni un secret faltante: este camino no usa"
            echo "ninguna credencial de organización. Se revisa en la página del"
            echo "paquete → Package settings → Manage Actions access."
          } >&2
          exit 1

      - name: Plan (y borrado, si no es dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          # El default sigue siendo dry-run, igual que antes: el borrado real se
          # pide explícitamente. Que esa decisión se automatice o no es un
          # debate aparte y no se resuelve en este PR — acá sólo cambió QUIÉN
          # corre la poda y con qué credencial, no cuándo borra.
          DRY_RUN: ${{ inputs.dry-run }}
          KEEP: ${{ inputs.keep }}
          PACKAGES: ${{ inputs.packages }}
          MAX_DELETES: ${{ inputs.max-deletes }}
        run: |
          set -euo pipefail

          # (b): un tag de entorno vuelve INTOCABLE a la versión que lo lleva,
          # por vieja que sea. `stable` es el canal de prod (el nombre que el
          # deploy-dashboard tiene hardcodeado); `<env>-stable` es el de los
          # demás entornos.
          PROTECTED_RE='^(latest|stable|[a-z0-9]([a-z0-9-]*[a-z0-9])?-stable)$'

          echo "keep=${KEEP}  dry-run=${DRY_RUN}  max-deletes=${MAX_DELETES}"
          echo "tags protegidos: ${PROTECTED_RE}"
          echo ""

          # Los nombres vienen del descriptor de este repo, NO de listar la
          # org: leído con GITHUB_TOKEN, `.repository` del paquete vuelve null,
          # así que la pertenencia no se puede descubrir por la API. Ver la
          # cabecera, "CÓMO SE SABE QUÉ PAQUETES SON MÍOS".
          packages=$(printf '%s' "${PACKAGES}" | jq -r '.[]')

          planned=0
          deleted=0
          capped=0
          skipped=0
          rows=""

          while IFS= read -r pkg; do
            [ -n "${pkg}" ] || continue
            # Dos paquetes llevan '/' en el nombre (loving.wedding/frontend y
            # /backend) y la API los quiere url-encodeados.
            enc=$(printf '%s' "${pkg}" | sed 's|/|%2F|g')

            versions=$(gh api --paginate \
              "/orgs/${ORG}/packages/container/${enc}/versions?per_page=100" \
              -q '.[] | {id, created_at, tags: (.metadata.container.tags // [])}' | jq -s '.')

            plan=$(jq -c --argjson keep "${KEEP}" --arg re "${PROTECTED_RE}" '
              sort_by(.created_at) | reverse
              | to_entries
              | map(.value + {
                  protected: ([.value.tags[]? | select(test($re))] | length > 0),
                  recent: (.key < $keep)
                })
              | map(. + {keep: (.protected or .recent)})
            ' <<<"${versions}")

            n=$(jq 'length' <<<"${plan}")
            n_keep=$(jq '[.[] | select(.keep)] | length' <<<"${plan}")
            n_del=$(( n - n_keep ))
            n_prot=$(jq '[.[] | select(.protected)] | length' <<<"${plan}")

            echo "── ${pkg}: ${n} versiones → conservar ${n_keep}, borrar ${n_del}"
            jq -r '.[] | select(.keep)
              | "   KEEP    \(.id)  \(.created_at)  [\(.tags | join(", "))]" +
                (if .protected then "  ← tag de entorno" else "" end)' <<<"${plan}"

            # ── GUARDA: un paquete sin NINGÚN tag de entorno no se toca ──
            # Toda la seguridad de este workflow descansa en la condición (b), y
            # (b) no existe para un paquete donde ninguna versión lleva tag de
            # entorno. Ese estado tiene DOS lecturas que desde acá no se pueden
            # distinguir, y una de las dos es cara:
            #
            #   1. nunca se desplegó a ningún entorno   → borrar es seguro;
            #   2. el tagueo viene fallando en silencio → borrar se lleva puesta
            #      la imagen que un entorno está corriendo.
            #
            # La (2) no es teórica: `tag_env_channel` (infra/deploy-service.sh) es
            # best-effort A PROPÓSITO — un fallo al pushear el tag sólo warnea y
            # el deploy sigue verde, que es lo correcto para el deploy y
            # justamente lo que deja este agujero. Y el costo de equivocarse es
            # el de prod corriendo noten-api v1.24.0, 55 releases atrás.
            #
            # Así que se saltea y lo decide una persona: o es legacy y se borra
            # el paquete entero a mano, o es un tagueo roto y se arregla. Tres
            # paquetes muertos ocupando espacio salen mucho más baratos que una
            # imagen viva borrada.
            if [ "${n_prot}" -eq 0 ]; then
              echo "::warning::${pkg}: ninguna de sus ${n} versiones lleva tag de entorno — se saltea. O nunca se desplegó (legacy: borralo a mano) o el tagueo de deploy está fallando (arreglalo antes de que la retención lo alcance)."
              skipped=$(( skipped + 1 ))
              rows="${rows}| \`${pkg}\` | ${n} | ${n} | — salteado |"$'\n'
              continue
            fi

            # ── PISO DE SEGURIDAD ──
            # Un bug en el filtro no puede vaciar el registry: si el plan
            # borrara TODO, o dejara menos de `keep` versiones habiendo más,
            # el job falla y no borra nada de nadie.
            floor=$(( n < KEEP ? n : KEEP ))
            if [ "${n_del}" -gt 0 ] && { [ "${n_keep}" -lt "${floor}" ] || [ "${n_del}" -eq "${n}" ]; }; then
              echo "::error::${pkg}: el plan dejaría ${n_keep}/${n} versiones (piso ${floor}). Abortando sin borrar."
              exit 1
            fi

            if [ "${n_del}" -eq 0 ]; then
              rows="${rows}| \`${pkg}\` | ${n} | ${n_keep} | 0 |"$'\n'
              continue
            fi

            jq -r '.[] | select(.keep | not)
              | "   DELETE  \(.id)  \(.created_at)  [\(.tags | join(", "))]"' <<<"${plan}"
            planned=$(( planned + n_del ))
            rows="${rows}| \`${pkg}\` | ${n} | ${n_keep} | ${n_del} |"$'\n'

            if [ "${DRY_RUN}" = "true" ]; then
              continue
            fi

            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              if [ "${MAX_DELETES}" != "0" ] && [ "${deleted}" -ge "${MAX_DELETES}" ]; then
                capped=1
                break
              fi
              gh api --method DELETE --silent \
                "/orgs/${ORG}/packages/container/${enc}/versions/${id}"
              deleted=$(( deleted + 1 ))
              # Los borrados son escrituras: el límite secundario de la API
              # castiga las ráfagas, y acá la primera corrida real son miles.
              sleep 1
            done < <(jq -r '.[] | select(.keep | not) | .id' <<<"${plan}")
          done <<<"${packages}"

          {
            echo "## GHCR retention"
            echo ""
            if [ "${DRY_RUN}" = "true" ]; then
              echo "**DRY RUN** — no se borró nada. Plan: **${planned}** versiones."
            else
              echo "Borradas: **${deleted}** de **${planned}** planeadas."
              [ "${capped}" = "1" ] && echo ""
              [ "${capped}" = "1" ] && echo "> Cortado por \`max-deletes=${MAX_DELETES}\`; la próxima corrida sigue donde quedó."
            fi
            echo ""
            echo "Regla: conservar las últimas \`${KEEP}\` por fecha **+** toda versión con tag de entorno (\`latest\`, \`stable\`, \`<env>-stable\`)."
            echo ""
            # Esta línea es el canario de `tag_env_channel`: si el número sube,
            # o hay un paquete nuevo que nunca se desplegó, o el tagueo de
            # deploy empezó a fallar en silencio (es best-effort).
            echo "Paquetes **salteados** por no tener ninguna versión con tag de entorno: **${skipped}**."
            echo ""
            echo "| paquete | versiones | conservadas | a borrar |"
            echo "|---|---:|---:|---:|"
            printf '%s' "${rows}"
          } >> "${GITHUB_STEP_SUMMARY}"
