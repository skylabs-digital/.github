name: CI (reusables lint)

# El repo org no tenía CI propio: un reusable inválido (ej. un `env:` vacío,
# que PyYAML acepta y el parser de GitHub no) solo se manifestaba como un run
# stub "workflow file issue" post-push — y en main rompería a los 25
# consumidores en el acto. Bead sl-bh3 (wrapper), análisis
# 2026-08-24-pipeline-drift-assessment.md (Addendum).
# SIN `paths:` A PROPOSITO. `actionlint + parser checks` es el UNICO check que
# el ruleset protect-main exige para mergear, y un check que no corre nunca se
# queda en "expected": un PR que no toca workflows (docs, README, plantillas)
# queda trabado para siempre y ni un admin lo puede mergear — el unico bypass
# del ruleset es la App semantic-release-bot-skylabs. Le paso a #38 (docs del
# repo). Correrlo siempre cuesta ~30 s de runner y hace que el check signifique
# lo mismo en todos los PRs.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + parser checks
    # ⚠️ NO VOLVER A `[self-hosted, linux, x64, skylabs]`.
    #
    # Este es el ÚNICO repo público de la org (los otros 40 son privados) y
    # este es su único workflow que dispara con un evento no confiable
    # (`pull_request`, que incluye PRs desde forks de desconocidos). El pool
    # self-hosted es un host persistente y compartido: entre jobs sólo se
    # limpian los contenedores, `_work` y las credenciales del agente — todo
    # lo demás ($HOME, /usr/local/bin, cron, ~/.bashrc, la caché de yarn)
    # sobrevive. Y es el MISMO pool donde corren `provision-env`, `operators`
    # y el deploy de prod, con SOPS_AGE_KEY y DEPLOY_SSH_KEY en el entorno.
    #
    # La política de forks de la org es `first_time_contributors`: alcanza con
    # aprobarle una sola PR de tipeo a un desconocido para que tenga corridas
    # automáticas sobre ese pool para siempre. Un PR de fork no recibe secrets
    # —no los necesita— porque lo que gana es escritura persistente en el host
    # que los otros jobs sí usan.
    #
    # Acá no hace falta nada del pool: este job sólo lintea archivos del
    # checkout. `ubuntu-latest` es una VM descartable y, en un repo público, no
    # consume minutos. Bead sl-41bx (P0).
    #
    # El NOMBRE del job no se toca: `actionlint + parser checks` es el único
    # required status check del ruleset `protect-main` de este repo, y
    # renombrarlo dejaría todos los PRs trabados en "expected".
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # actionlint valida schema de workflows, expresiones ${{ }} y shellcheck
      # de los bloques run:. Imagen pineada por tag inmutable del proyecto.
      # SHELLCHECK_OPTS: los reusables acumulan findings info-level (SC2086
      # quoting, SC2209/SC2015 falsos positivos como BUMP=patch); se excluyen
      # para que el gate solo bloquee errores reales — limpieza de quoting
      # trackeada en beads (github-*, hygiene shellcheck).
      - name: actionlint
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          -e SHELLCHECK_OPTS='--exclude=SC2086,SC2209,SC2015'
          rhysd/actionlint:1.7.7 -color

      # Lo que actionlint no cubre y ya nos mordió: mappings vacíos (env:/with:/
      # secrets:/permissions:/outputs: con valor null) — PyYAML los acepta, el
      # parser de GitHub no, y el resultado es el stub "workflow file issue".
      - name: Empty-mapping check
        run: |
          # PyYAML venía puesto en el runner self-hosted y viene en la imagen
          # de ubuntu-latest, pero el check no puede quedar verde sin haber
          # corrido: si falta, se instala. `--break-system-packages` es por el
          # PEP 668 de Ubuntu 24.04; el segundo intento es para un pip < 23.
          python3 -c 'import yaml' 2>/dev/null \
            || pip install --quiet --disable-pip-version-check --break-system-packages pyyaml \
            || pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import sys, yaml, glob
          bad = []
          for f in glob.glob('.github/workflows/*.yml'):
              d = yaml.safe_load(open(f))
              def walk(o, p=''):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if v is None and k in ('env', 'with', 'secrets', 'permissions', 'outputs', 'inputs'):
                              bad.append(f'{f}: {p}/{k} es un mapping vacío')
                          walk(v, f'{p}/{k}')
                  elif isinstance(o, list):
                      for i, v in enumerate(o): walk(v, f'{p}[{i}]')
              walk(d)
          for b in bad: print(f'::error::{b}')
          sys.exit(1 if bad else 0)
          PY

      # Invariants actionlint cannot express (SHA pins, permissions, where the
      # deploy keys may appear) and behaviour tests that run the REAL `run:`
      # of a step against throwaway git repos (the bumper, the ssh pinning).
      # PyYAML is already there from the step above.
      - name: Workflow invariants + behaviour tests
        run: bash scripts/tests/run-all.sh

      # bootstrap.sh se sirve por raw.githubusercontent y se corre con `curl | bash`
      # en las máquinas del equipo: es el shell de este repo que más caro sale
      # romper, así que entra al mismo gate que scripts/.
      - name: shellcheck de scripts/ y bootstrap.sh
        run: |
          archivos=()
          ls scripts/*.sh >/dev/null 2>&1 && archivos+=(scripts/*.sh)
          ls scripts/tests/*.sh >/dev/null 2>&1 && archivos+=(scripts/tests/*.sh)
          [ -f bootstrap.sh ] && archivos+=(bootstrap.sh)
          if [ ${#archivos[@]} -gt 0 ]; then
            docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck:v0.11.0 "${archivos[@]}"
          fi
