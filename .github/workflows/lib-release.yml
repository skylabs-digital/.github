name: Lib Release (reusable)

# ============================================================================
# Reusable unified release pipeline for Skylabs Digital LIBRARIES (npm publish).
# One file, FULL-on-main / REDUCED-on-PR fork encoded ENTIRELY inside here —
# callers only declare `on:` triggers.
#
#   STAGE 1  ci         static-checks: typecheck + lint + test (coverage floor)
#                       + Stryker incremental mutation (parallel required check)
#   STAGE 1  security   org reusable security.yml@v1 (OSV + Gitleaks; no images)
#   STAGE 2  release    semantic-release (version + npm publish) — push:main only
#
# The fork point is the `release` job: `if: push && ref==main`. On a PR it
# never runs, so PRs get exactly ci + security (REDUCED); main push also
# publishes (FULL).
#
# `run-mutation: true` (default) wires Stryker incremental as a REQUIRED
# parallel check — closing the ecosystem-wide "Stryker configured locally but
# absent from CI" gap without each lib hand-rolling a stryker-pr.yml.
#
# All third-party actions are SHA-pinned here so every consumer inherits the
# supply-chain hardening for free.
#
# ----------------------------------------------------------------------------
# HOW A CONSUMING REPO CALLS THIS (minimal caller `.github/workflows/release.yml`):
#
#   name: Release
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#     schedule:
#       - cron: '0 6 * * 1'
#   permissions:
#     contents: write
#     packages: write
#     id-token: write
#   jobs:
#     release:
#       uses: skylabs-digital/.github/.github/workflows/lib-release.yml@main
#       with:
#         node-version: '24'
#         build-tool: tsup        # tsc | tsup | vite
#         run-mutation: true      # Stryker incremental as a required check
#         coverage-floor: 90
#       secrets: inherit
#
# `secrets: inherit` passes GHCR_TOKEN, SEMANTIC_RELEASE_APP_ID/_PRIVATE_KEY.
# The lib must define `yarn typecheck`, `yarn lint`, `yarn test`, `yarn build`,
# `yarn mutation` (or `stryker run`), and a `release.config.*` for
# semantic-release. coverage-floor is enforced via the lib's own vitest config
# (`coverageThreshold`); this input is forwarded as STRYKER/COVERAGE_FLOOR for
# repos that read it.
# ============================================================================

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version'
        type: string
        default: '24'
      build-tool:
        description: 'Build tool the lib uses (tsc | tsup | vite). Informational; `yarn build` is invoked.'
        type: string
        default: tsc
      run-mutation:
        description: 'Run Stryker incremental mutation testing as a required parallel check'
        type: boolean
        default: true
      coverage-floor:
        description: 'DEPRECATED (sl-8a5): accepted for caller compatibility only — nothing in this reusable reads it. Enforce coverage in the lib vitest config (coverage-discipline.md). Callers drop it in the weekly sweep; the input is removed once no caller passes it.'
        type: number
        default: 90
      # ----------------------------------------------------------------
      # Repo-specific gates (sl-eab / react-identity-access-eab).
      #
      # THE PROBLEM THIS SOLVES. This reusable does NOT invoke `yarn ci`: the
      # `ci` job below runs four hardcoded steps. So any gate a lib adds to its
      # own `ci` script exists in that repo's pre-push hook and NOWHERE in CI.
      # The repo believes it has a gate and it does not. Today the workaround is
      # to inline a whole extra job in the caller — which costs an entire
      # `yarn install` per gate, per repo (react-identity-access ships a
      # `repo-gates` job for exactly this).
      #
      # WHY TWO HOOKS AND NOT ONE. Real gates land on both sides of the build:
      #   before  spec-check, ast-check, docs-check — static, cheap, fail fast
      #   after   dual-format smoke tests, bundle-size budgets, `npm pack`
      #           checks — they need `dist/` to exist
      # A single hook forces the second kind to either re-build or not run.
      #
      # BOTH DEFAULT TO EMPTY, so the steps are skipped and the ~18 current
      # callers are byte-for-byte unaffected. Opt-in, additive, no contract
      # change.
      #
      # WHY NOT "just run `yarn ci` when the script exists": it changes the
      # contract for all 18 callers at once, and any repo with a heavier `ci`
      # silently gets a longer pipeline it never asked for.
      # ----------------------------------------------------------------
      extra-ci-steps:
        description: 'Shell to run inside the `ci` job AFTER Lint and BEFORE Test. For static repo-specific gates (spec-check, ast-check, docs-check). Empty = skipped.'
        type: string
        default: ''
      extra-ci-steps-post-build:
        description: 'Shell to run inside the `ci` job AFTER Build. For gates that need `dist/` (dual-format smoke, pack checks, size budgets). Empty = skipped.'
        type: string
        default: ''
    secrets:
      GHCR_TOKEN:
        description: 'Classic PAT (read:packages + write:packages) for private npm deps + GitHub Packages publish'
        required: false
      SEMANTIC_RELEASE_APP_ID:
        description: 'GitHub App id for semantic-release-bot-skylabs'
        required: false
      SEMANTIC_RELEASE_PRIVATE_KEY:
        description: 'GitHub App private key matching SEMANTIC_RELEASE_APP_ID'
        required: false

# husky must not run on the runner. Since the fleet moved hooks to
# `postinstall` (sl-06k), `yarn install` installs them in CI too — the checkout
# has a `.git` — and every git operation the workflow performs goes through
# them: semantic-release's `git commit` hits pre-commit/commit-msg and its
# `git push` runs the pre-push (a full `yarn ci`, duplicated). Measured on
# 2026-09-02: the extra minute inside the push is exactly the window in which
# a second merge to main lands and the push is rejected (menu-engine 16:04,
# react-proto-kit 16:23). CI is the gate here, not the hooks. See
# skylabs/docs/analyses/2026-09-02-revision-estabilidad-libs.md (sl-husky-en-ci).
env:
  HUSKY: 0

jobs:
  # ============================================================
  # STAGE 1 — CI (static checks + coverage)
  # ============================================================
  ci:
    if: github.actor != 'dependabot[bot]' && github.event_name != 'schedule'
    name: CI (typecheck + lint + test)
    runs-on: [self-hosted, linux, x64, skylabs]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skylabs-digital'
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      # Repo-specific static gates. Skipped unless the caller passes them, so
      # the ~18 existing callers see no change. Reuses the install above, which
      # is the whole point: an inlined per-gate job pays for `yarn install`
      # again, per gate, per repo.
      - name: Repo gates (pre-build)
        if: ${{ inputs.extra-ci-steps != '' }}
        run: ${{ inputs.extra-ci-steps }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: Test (coverage)
        run: yarn test --coverage
      - name: Build
        run: yarn build
      # Repo-specific gates that need `dist/` — dual-format smoke tests, pack
      # checks, bundle-size budgets. This is why one hook was not enough.
      - name: Repo gates (post-build)
        if: ${{ inputs.extra-ci-steps-post-build != '' }}
        run: ${{ inputs.extra-ci-steps-post-build }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}

  # ============================================================
  # STAGE 1 — MUTATION (Stryker incremental) — INFORMATIVE PARALLEL CHECK
  # Closes the ecosystem-wide "Stryker local-only" gap. Runs on every event
  # (PR + push:main) when run-mutation is true. NON-BLOCKING: a mutation-score
  # regression is surfaced as a ::warning:: + job summary but the job always
  # succeeds, so it never blocks a merge or the release. Mutation testing is a
  # signal to act on, not a gate, for a small team.
  # ============================================================
  mutation:
    if: ${{ inputs.run-mutation && github.actor != 'dependabot[bot]' && github.event_name != 'schedule' }}
    name: Mutation (Stryker incremental)
    runs-on: [self-hosted, linux, x64, skylabs]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skylabs-digital'
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      # Stryker's incremental mode only works if .stryker-tmp/incremental.json
      # survives between runs — the path is gitignored and the checkout is clean,
      # so without this cache every run is a FULL mutation run (sl-0oc; donor
      # pattern: noten/.github/workflows/mutation.yml). Restore falls back to the
      # branch's latest, then main's. Save runs unconditionally (the Stryker step
      # is non-blocking, so a below-threshold run must still persist its state).
      - name: Restore Stryker incremental state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-
      - name: Stryker (mutation) — informative, non-blocking
        # Run the repo's canonical mutation script. The standard lib script is
        # `test:mutation`; some repos also alias `mutation`. Prefer test:mutation,
        # fall back to mutation. If neither exists, skip with a warning — do NOT
        # `yarn dlx stryker run`: bare `stryker` resolves to the ancient,
        # abandoned stryker@0.35.x package (modern one is @stryker-mutator/core),
        # which crashes with "Cannot find module 'stryker-api/config'" and fails
        # the whole job. Incremental mode is the repo's stryker.conf concern.
        #
        # NON-BLOCKING: we capture Stryker's exit code and always exit 0. A
        # threshold regression becomes a ::warning:: + job summary, not a failure.
        run: |
          # GitHub Actions runs `run:` steps with `bash -e -o pipefail`; `set -uo`
          # does NOT clear the inherited -e, so `yarn test:mutation; rc=$?` used to
          # abort the script on Stryker's exit 1 before reaching `exit 0` — the
          # "non-blocking" step blocked releases (sl-1qu, testlab-review run
          # 32508327098). `set +e` makes the contract real.
          set +e
          set -uo pipefail   # NOT -e: we handle the exit code ourselves
          if node -e "const s=require('./package.json').scripts||{};process.exit(s['test:mutation']?0:1)"; then
            yarn test:mutation; rc=$?
          elif node -e "const s=require('./package.json').scripts||{};process.exit(s.mutation?0:1)"; then
            yarn mutation; rc=$?
          else
            echo "::warning::No test:mutation or mutation script found — skipping mutation testing"
            rc=0
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "::warning title=Mutation score below threshold::Stryker exited ${rc}. Informative only — not blocking the merge/release. Review the report above and raise coverage where it matters."
            { echo "## ⚠️ Mutation (Stryker) — below threshold (informative)";
              echo "";
              echo "Stryker exited \`${rc}\`. This check is **non-blocking**; review the mutants above and add tests where the gap is meaningful."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Mutation (Stryker) — passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Save Stryker incremental state
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}

  # ============================================================
  # STAGE 1 — SECURITY (org reusable@v1). No docker-images for libs, so Grype
  # is skipped; OSV + Gitleaks run on every event.
  # ============================================================
  security:
    name: Security (org reusable@v1)
    uses: skylabs-digital/.github/.github/workflows/security.yml@v1
    secrets:
      npm-token: ${{ secrets.GHCR_TOKEN }}

  # ============================================================
  # STAGE 2 — SEMANTIC RELEASE (version + npm publish) — push:main only.
  # THE FORK POINT: never runs on PR/non-main/schedule (= REDUCED run).
  # ============================================================
  release:
    name: Semantic release
    needs: [ci, mutation, security]
    # `mutation` is informative (always succeeds) and may be skipped
    # (run-mutation:false); !failure() lets release proceed in both cases while
    # still blocking on a real ci/security failure.
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, skylabs]
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skylabs-digital'
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: Build
        run: yarn build
      # Retry-recalculando, la misma semantica que ya tiene el bumper de
      # app-release.yml: si `main` se movio mientras corria el release (dos
      # merges seguidos), el push del commit de release rebota. Ese push ocurre
      # en el paso `prepare` de @semantic-release/git, ANTES de `publish`, asi
      # que un rebote no dejo nada publicado: se descarta el intento, se
      # refresca origin/main, se reinstala y rebuildea (el otro merge pudo
      # tocar deps o src) y semantic-release recalcula la version entera desde
      # los tags contra la base real. Si `main` NO se movio, el fallo es real y
      # no se reintenta. Medido el 2026-09-02 (menu-engine 16:04,
      # react-proto-kit 16:23); plan en
      # skylabs/docs/analyses/2026-09-02-plan-release-y-versionado-flota.md.
      - name: Semantic release
        run: |
          for attempt in 1 2 3; do
            if yarn dlx semantic-release; then
              exit 0
            fi
            git fetch --tags --force --prune --prune-tags --quiet origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "::error::semantic-release fallo y main no se movio (intento ${attempt}): fallo real, no se reintenta"
              exit 1
            fi
            echo "::warning::main se movio durante el release (intento ${attempt}): se descarta el intento y se recalcula contra origin/main"
            git reset --hard --quiet origin/main
            NODE_AUTH_TOKEN="${GHCR_TOKEN}" yarn install --immutable
            yarn build
          done
          echo "::error::main siguio moviendose en tres intentos seguidos; se corta aca y el proximo push a main publica"
          exit 1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
