name: Lib Release (reusable)

# ============================================================================
# Reusable unified release pipeline for Skylabs Digital LIBRARIES (npm publish).
# One file, FULL-on-main / REDUCED-on-PR fork encoded ENTIRELY inside here —
# callers only declare `on:` triggers.
#
#   STAGE 1  ci         static-checks: typecheck + lint + test (coverage floor)
#   STAGE 1  mutation   Stryker — incremental + informative on PR/push,
#                       full + blocking on the weekly `schedule` (mutation gate)
#   STAGE 1  security   org reusable security.yml@main (OSV + Gitleaks; no images)
#   STAGE 2  release    semantic-release (version + npm publish) — push:main only
#
# The fork point is the `release` job: `if: push && ref==main`. On a PR it
# never runs, so PRs get exactly ci + security (REDUCED); main push also
# publishes (FULL).
#
# `run-mutation: true` (default) wires Stryker into CI without each lib
# hand-rolling a stryker-pr.yml. It is NOT a required status check and it is
# NOT on the release's critical path: `release` does not wait for it. The gate
# (Stryker's `thresholds.break` failing the job) is enforced where it costs
# nobody a merge — the weekly `schedule` full run. See the `mutation` job and
# the wrapper standard docs/standards/mutation-testing.md (mutation gate).
#
# All third-party actions are SHA-pinned here so every consumer inherits the
# supply-chain hardening for free.
#
# ----------------------------------------------------------------------------
# HOW A CONSUMING REPO CALLS THIS (minimal caller `.github/workflows/release.yml`):
#
#   name: Release
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#     schedule:
#       - cron: '0 6 * * 1'
#   permissions:
#     contents: write
#     packages: write
#     id-token: write
#   jobs:
#     release:
#       uses: skylabs-digital/.github/.github/workflows/lib-release.yml@main
#       with:
#         node-version: '24'
#         build-tool: tsup        # tsc | tsup | vite
#         run-mutation: true      # Stryker in CI (see the `mutation` job)
#       secrets: inherit
#
# `secrets: inherit` passes GHCR_TOKEN, SEMANTIC_RELEASE_APP_ID/_PRIVATE_KEY.
# The lib must define `yarn typecheck`, `yarn lint`, `yarn test`, `yarn build`,
# `yarn mutation` (or `stryker run`), and a `release.config.*` for
# semantic-release. coverage-floor is enforced via the lib's own vitest config
# (`coverageThreshold`); this input is forwarded as STRYKER/COVERAGE_FLOOR for
# repos that read it.
# ============================================================================

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version'
        type: string
        default: '24'
      build-tool:
        description: 'Build tool the lib uses (tsc | tsup | vite). Informational; `yarn build` is invoked.'
        type: string
        default: tsc
      run-mutation:
        description: 'Master switch for Stryker in CI. false = no mutation job on any event (PR, push, schedule).'
        type: boolean
        default: true
      # ----------------------------------------------------------------
      # Mutation gate (wrapper bead plato-dx7w, analysis
      # 2026-09-23-mutation-gate). Both inputs are optional and their defaults
      # leave every PR and push:main run exactly as informative as before; the
      # only new behaviour is the weekly `schedule` run, which used to skip
      # mutation altogether.
      # ----------------------------------------------------------------
      mutation-on-change:
        description: 'Run Stryker incremental on pull_request / push (informative). false = the lib measures mutation only on the weekly schedule (and workflow_dispatch). Ignored when run-mutation is false.'
        type: boolean
        default: true
      mutation-break-blocks:
        description: 'Where a result below Stryker thresholds.break (or a Stryker run that could not measure at all) FAILS the job: never | schedule | always. `schedule` = the weekly full run (and workflow_dispatch) goes red; PR/push stay informative.'
        type: string
        default: schedule
      mutation-timeout-minutes:
        description: 'timeout-minutes of the mutation job. A full run of the slowest lib measured 14 min (forms-react, 2026-09-22).'
        type: number
        default: 60
      coverage-floor:
        description: 'DEPRECATED (sl-8a5): accepted for caller compatibility only — nothing in this reusable reads it. Enforce coverage in the lib vitest config (coverage-discipline.md). Callers drop it in the weekly sweep; the input is removed once no caller passes it.'
        type: number
        default: 90
      # ----------------------------------------------------------------
      # Repo-specific gates (sl-eab / react-identity-access-eab).
      #
      # THE PROBLEM THIS SOLVES. This reusable does NOT invoke `yarn ci`: the
      # `ci` job below runs four hardcoded steps. So any gate a lib adds to its
      # own `ci` script exists in that repo's pre-push hook and NOWHERE in CI.
      # The repo believes it has a gate and it does not. Today the workaround is
      # to inline a whole extra job in the caller — which costs an entire
      # `yarn install` per gate, per repo (react-identity-access ships a
      # `repo-gates` job for exactly this).
      #
      # WHY TWO HOOKS AND NOT ONE. Real gates land on both sides of the build:
      #   before  spec-check, ast-check, docs-check — static, cheap, fail fast
      #   after   dual-format smoke tests, bundle-size budgets, `npm pack`
      #           checks — they need `dist/` to exist
      # A single hook forces the second kind to either re-build or not run.
      #
      # BOTH DEFAULT TO EMPTY, so the steps are skipped and the ~18 current
      # callers are byte-for-byte unaffected. Opt-in, additive, no contract
      # change.
      #
      # WHY NOT "just run `yarn ci` when the script exists": it changes the
      # contract for all 18 callers at once, and any repo with a heavier `ci`
      # silently gets a longer pipeline it never asked for.
      # ----------------------------------------------------------------
      extra-ci-steps:
        description: 'Shell to run inside the `ci` job AFTER Lint and BEFORE Test. For static repo-specific gates (spec-check, ast-check, docs-check). Empty = skipped.'
        type: string
        default: ''
      extra-ci-steps-post-build:
        description: 'Shell to run inside the `ci` job AFTER Build. For gates that need `dist/` (dual-format smoke, pack checks, size budgets). Empty = skipped.'
        type: string
        default: ''
    secrets:
      GHCR_TOKEN:
        description: 'Classic PAT (read:packages + write:packages) for private npm deps + GitHub Packages publish'
        required: false
      SEMANTIC_RELEASE_APP_ID:
        description: 'GitHub App id for semantic-release-bot-skylabs'
        required: false
      SEMANTIC_RELEASE_PRIVATE_KEY:
        description: 'GitHub App private key matching SEMANTIC_RELEASE_APP_ID'
        required: false

# husky must not run on the runner. Since the fleet moved hooks to
# `postinstall` (sl-06k), `yarn install` installs them in CI too — the checkout
# has a `.git` — and every git operation the workflow performs goes through
# them: semantic-release's `git commit` hits pre-commit/commit-msg and its
# `git push` runs the pre-push (a full `yarn ci`, duplicated). Measured on
# 2026-09-02: the extra minute inside the push is exactly the window in which
# a second merge to main lands and the push is rejected (menu-engine 16:04,
# react-proto-kit 16:23). CI is the gate here, not the hooks. See
# skylabs/docs/analyses/2026-09-02-revision-estabilidad-libs.md (sl-husky-en-ci).
env:
  HUSKY: 0

jobs:
  # ============================================================
  # STAGE 1 — CI (static checks + coverage)
  # ============================================================
  ci:
    if: github.actor != 'dependabot[bot]' && github.event_name != 'schedule'
    name: CI (typecheck + lint + test)
    runs-on: [self-hosted, linux, x64, skylabs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skylabs-digital'
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      # Repo-specific static gates. Skipped unless the caller passes them, so
      # the ~18 existing callers see no change. Reuses the install above, which
      # is the whole point: an inlined per-gate job pays for `yarn install`
      # again, per gate, per repo.
      - name: Repo gates (pre-build)
        if: ${{ inputs.extra-ci-steps != '' }}
        run: ${{ inputs.extra-ci-steps }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: Test (coverage)
        run: yarn test --coverage
      - name: Build
        run: yarn build
      # Repo-specific gates that need `dist/` — dual-format smoke tests, pack
      # checks, bundle-size budgets. This is why one hook was not enough.
      - name: Repo gates (post-build)
        if: ${{ inputs.extra-ci-steps-post-build != '' }}
        run: ${{ inputs.extra-ci-steps-post-build }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}

  # ============================================================
  # STAGE 1 — MUTATION (Stryker) — the mutation gate
  #
  # Two modes, chosen by the event (wrapper bead plato-dx7w, analysis
  # 2026-09-23-mutation-gate, standard docs/standards/mutation-testing.md):
  #
  #   pull_request / push   INCREMENTAL, INFORMATIVE. Only when
  #                         mutation-on-change is true (default). Reuses the
  #                         cached .stryker-tmp/incremental.json, so a typical
  #                         run is 1-2 min. A score below `break` is a
  #                         ::warning:: + job summary — it never fails the job
  #                         (unless mutation-break-blocks: always).
  #   schedule / dispatch   FULL, BLOCKING. The weekly cron every lib already
  #                         declares. Runs `test:mutation:full` if the lib has
  #                         it, else `test:mutation --force` (Stryker's
  #                         "ignore the incremental file" flag). A score below
  #                         `break` — or a Stryker run that could not measure
  #                         at all — FAILS the job (mutation-break-blocks:
  #                         schedule, the default). Its incremental file is
  #                         saved as the freshest main cache, so PR runs reuse
  #                         a result at most one week old.
  #
  # WHY NOT BLOCK ON PR / PUSH. Stryker's `break` is an ABSOLUTE score over the
  # whole lib, not over the diff: a PR that touches docs could go red for a gap
  # that predates it. And the full run costs up to ~14 min per lib — the reason
  # mutation was pulled out of the pipelines on 2026-09-01 (plato-wsfp).
  #
  # NOT ON THE RELEASE PATH. `release` does not `needs:` this job any more: a
  # slow or red mutation run never delays or blocks a publish.
  # ============================================================
  mutation:
    if: >-
      ${{ inputs.run-mutation && github.actor != 'dependabot[bot]' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.mutation-on-change) }}
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'Mutation (Stryker full)' || 'Mutation (Stryker incremental)' }}
    runs-on: [self-hosted, linux, x64, skylabs]
    timeout-minutes: ${{ inputs.mutation-timeout-minutes }}
    env:
      MUTATION_FULL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skylabs-digital'
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      # Stryker's incremental mode only works if .stryker-tmp/incremental.json
      # survives between runs — the path is gitignored and the checkout is clean,
      # so without this cache every run is a FULL mutation run (sl-0oc; donor
      # pattern: noten/.github/workflows/mutation.yml). Restore falls back to the
      # branch's latest, then main's latest — which, since the weekly full run
      # saves under the main prefix too, is never older than a week's lineage.
      # The full run does not restore: it would ignore the file anyway.
      - name: Restore Stryker incremental state
        if: env.MUTATION_FULL != 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-${{ github.sha }}-
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-
      - name: Stryker (mutation)
        # Run the repo's canonical mutation script. The standard lib script is
        # `test:mutation`; some repos also alias `mutation`. Prefer test:mutation,
        # fall back to mutation. If neither exists, skip with a warning — do NOT
        # `yarn dlx stryker run`: bare `stryker` resolves to the ancient,
        # abandoned stryker@0.35.x package (modern one is @stryker-mutator/core),
        # which crashes with "Cannot find module 'stryker-api/config'" and fails
        # the whole job. Incremental mode is the repo's stryker.conf concern.
        #
        # Stryker exits 1 both when the score is under `break` AND when it could
        # not measure at all (e.g. "There were failed tests in the initial test
        # run"). The old step reported both as "below threshold"; react-proto-kit
        # spent weeks with a crash labelled as a low score. The log is parsed so
        # the summary says which one happened, and prints the absolute score.
        env:
          BREAK_BLOCKS: ${{ inputs.mutation-break-blocks }}
        run: |
          # GitHub Actions runs `run:` steps with `bash -e -o pipefail`; `set -uo`
          # does NOT clear the inherited -e, so `yarn test:mutation; rc=$?` used to
          # abort the script on Stryker's exit 1 before reaching `exit 0` — the
          # "non-blocking" step blocked releases (sl-1qu, testlab-review run
          # 32508327098). `set +e` makes the contract real.
          set +e
          set -uo pipefail   # NOT -e: we handle the exit code ourselves

          case "${BREAK_BLOCKS}" in
            never)    blocking=false ;;
            schedule) blocking="${MUTATION_FULL}" ;;
            always)   blocking=true ;;
            *) echo "::error title=Invalid input::mutation-break-blocks must be never | schedule | always (got '${BREAK_BLOCKS}')"
               exit 1 ;;
          esac

          has_script() {
            node -e "const s=require('./package.json').scripts||{};process.exit(s[process.argv[1]]?0:1)" "$1"
          }
          cmd=()
          if [ "${MUTATION_FULL}" = true ]; then
            mode=full
            if has_script test:mutation:full; then cmd=(yarn test:mutation:full)
            elif has_script test:mutation; then cmd=(yarn test:mutation --force)
            elif has_script mutation; then cmd=(yarn mutation --force)
            fi
          else
            mode=incremental
            if has_script test:mutation; then cmd=(yarn test:mutation)
            elif has_script mutation; then cmd=(yarn mutation)
            fi
          fi

          if [ "${#cmd[@]}" -eq 0 ]; then
            echo "::warning::No test:mutation or mutation script found — skipping mutation testing"
            { echo "## ⚠️ Mutation (Stryker) — not measured";
              echo "";
              echo "The lib has no \`test:mutation\` / \`mutation\` script."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          log="${RUNNER_TEMP}/stryker.log"
          echo "Running (${mode}): ${cmd[*]}"
          "${cmd[@]}" 2>&1 | tee "${log}"
          rc=${PIPESTATUS[0]}

          # Strip ANSI colours before parsing Stryker's own lines:
          #   "Final mutation score of 94.80 is greater than or equal to break threshold 80"
          #   "Final mutation score 79.31 under breaking threshold 80, setting exit code to 1 (failure)."
          # and the clear-text reporter's "All files | 94.80 | ..." row as a
          # fallback for configs without `break`.
          plain="$(sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "${log}")"
          score="$(printf '%s\n' "${plain}" | grep -oE 'Final mutation score (of )?[0-9.]+' | tail -1 | grep -oE '[0-9.]+$')"
          if [ -z "${score}" ]; then
            score="$(printf '%s\n' "${plain}" | grep -E '^[[:space:]]*All files[[:space:]]*\|' | tail -1 | awk -F'|' '{gsub(/[[:space:]]/,"",$2); print $2}')"
          fi
          threshold="$(printf '%s\n' "${plain}" | grep -oE 'break(ing)? threshold (of )?[0-9.]+' | tail -1 | grep -oE '[0-9.]+$')"

          if [ "${rc}" -eq 0 ]; then
            outcome=passed
          elif printf '%s\n' "${plain}" | grep -q 'under breaking threshold'; then
            outcome=below
          else
            outcome=crashed
          fi

          {
            case "${outcome}" in
              passed)  echo "## ✅ Mutation (Stryker, ${mode}) — passed" ;;
              below)   echo "## $([ "${blocking}" = true ] && echo '❌' || echo '⚠️') Mutation (Stryker, ${mode}) — below break threshold" ;;
              crashed) echo "## $([ "${blocking}" = true ] && echo '❌' || echo '⚠️') Mutation (Stryker, ${mode}) — Stryker failed before producing a score" ;;
            esac
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mutation score | **${score:-n/a}** |"
            echo "| \`thresholds.break\` | ${threshold:-n/a} |"
            echo "| Mode | ${mode} (\`${cmd[*]}\`) |"
            echo "| Event | ${GITHUB_EVENT_NAME} |"
            echo "| Blocking on this event | ${blocking} (mutation-break-blocks: ${BREAK_BLOCKS}) |"
            echo "| Stryker exit code | ${rc} |"
            if [ "${mode}" = incremental ]; then
              echo ""
              echo "Incremental score: mutants of unchanged files are reused from the cached result, so this is the absolute score of the whole lib, not of the diff. The weekly full run is the authoritative measurement."
            fi
            if [ "${outcome}" = crashed ]; then
              echo ""
              echo "Stryker exited non-zero without a threshold verdict — typically failing tests in its initial dry run (see the log above). The lib has **no measured score** until this is fixed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          case "${outcome}" in
            passed) exit 0 ;;
            below)
              if [ "${blocking}" = true ]; then
                echo "::error title=Mutation score below break::Mutation score ${score:-?} is under thresholds.break ${threshold:-?} (${mode} run). Kill the surviving mutants, or — if the floor was never reachable — pin break to the measured score and ratchet up (mutation-testing.md)."
                exit 1
              fi
              echo "::warning title=Mutation score below break::Mutation score ${score:-?} is under thresholds.break ${threshold:-?}. Informative on ${GITHUB_EVENT_NAME}; the weekly full run enforces it."
              exit 0 ;;
            crashed)
              if [ "${blocking}" = true ]; then
                echo "::error title=Stryker could not measure::Stryker exited ${rc} without producing a score (${mode} run). See the log — usually failing tests in the initial dry run."
                exit 1
              fi
              echo "::warning title=Stryker could not measure::Stryker exited ${rc} without producing a score. Informative on ${GITHUB_EVENT_NAME}; the weekly full run fails on this."
              exit 0 ;;
          esac
      # Unique key per run: cache keys are immutable, and the weekly full run
      # usually lands on the same SHA as the last push to main — with a
      # `<ref>-<sha>` key its fresher result was silently dropped ("cache
      # already exists"). The restore side matches by prefix and takes the
      # newest, so the run id suffix costs nothing.
      - name: Save Stryker incremental state
        if: always() && hashFiles('.stryker-tmp/incremental.json') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: .stryker-tmp/incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  # ============================================================
  # STAGE 1 — SECURITY (org reusable, @main). No docker-images for libs, so Grype
  # is skipped; OSV + Gitleaks run on every event.
  # ============================================================
  security:
    # The job name keeps "@v1" on purpose: "release / Security (org reusable@v1) / …" is a
    # required status check in the org ruleset protect-main-apps and in each repo's ruleset.
    # Renaming it blocks every PR in the fleet until those rulesets are updated in lockstep.
    # The ref below is what decides the version: security.yml is consumed at @main, like the
    # rest of the reusables.
    name: Security (org reusable@v1)
    uses: skylabs-digital/.github/.github/workflows/security.yml@main
    secrets:
      npm-token: ${{ secrets.GHCR_TOKEN }}

  # ============================================================
  # STAGE 2 — SEMANTIC RELEASE (version + npm publish) — push:main only.
  # THE FORK POINT: never runs on PR/non-main/schedule (= REDUCED run).
  # ============================================================
  release:
    name: Semantic release
    # `mutation` is deliberately NOT in `needs`: it is not a release gate, and
    # waiting on it delayed publishes by up to ~14 min (the reason several libs
    # set run-mutation:false on 2026-09-01). The gate lives on the weekly
    # schedule run instead — see the `mutation` job.
    needs: [ci, security]
    if: |
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, skylabs]
    timeout-minutes: 15
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_PRIVATE_KEY }}
          # SIN `owner:` a propósito: sin él la action acota el token al repo
          # actual, que es lo único que este job toca (checkout, bump y push de
          # la lib). Con `owner` saldría con acceso a los 41 repos de la org.
          # Ver skylabs/docs/runbooks/apps-y-credenciales-de-la-org.md §1.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skylabs-digital'
          cache: yarn
      - name: Install
        run: yarn install --immutable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
      - name: Build
        run: yarn build
      # Retry-recalculando, la misma semantica que ya tiene el bumper de
      # app-release.yml: si `main` se movio mientras corria el release (dos
      # merges seguidos), el push del commit de release rebota. Ese push ocurre
      # en el paso `prepare` de @semantic-release/git, ANTES de `publish`, asi
      # que un rebote no dejo nada publicado: se descarta el intento, se
      # refresca origin/main, se reinstala y rebuildea (el otro merge pudo
      # tocar deps o src) y semantic-release recalcula la version entera desde
      # los tags contra la base real. Si `main` NO se movio, el fallo es real y
      # no se reintenta. Medido el 2026-09-02 (menu-engine 16:04,
      # react-proto-kit 16:23); plan en
      # skylabs/docs/analyses/2026-09-02-plan-release-y-versionado-flota.md.
      - name: Semantic release
        run: |
          for attempt in 1 2 3; do
            if yarn dlx semantic-release; then
              exit 0
            fi
            git fetch --tags --force --prune --prune-tags --quiet origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              echo "::error::semantic-release fallo y main no se movio (intento ${attempt}): fallo real, no se reintenta"
              exit 1
            fi
            echo "::warning::main se movio durante el release (intento ${attempt}): se descarta el intento y se recalcula contra origin/main"
            git reset --hard --quiet origin/main
            NODE_AUTH_TOKEN="${GHCR_TOKEN}" yarn install --immutable
            yarn build
          done
          echo "::error::main siguio moviendose en tres intentos seguidos; se corta aca y el proximo push a main publica"
          exit 1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
