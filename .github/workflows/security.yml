name: Security Scan (reusable)

# Reusable security workflow for Skylabs Digital repos.
# See README.md for usage and templates.
#
# Permissions: the scan jobs cap themselves at `contents: read` (DEP-15), a
# subset of what every caller grants. `weekly-security-report` inherits the
# caller's on purpose: it needs `issues: write` where the caller grants it, and
# asking for it here would fail the whole run at startup where it does not.

on:
  workflow_call:
    inputs:
      docker-images:
        description: 'JSON array of images to scan with Grype'
        type: string
        default: '[]'
      gitleaks-only:
        description: 'Skip OSV-Scanner (for non-Node repos)'
        type: boolean
        default: false
      osv-scan-args:
        description: 'Override OSV-Scanner scan targets'
        type: string
        default: |-
          --recursive
          ./
      osv-fail-on-severity:
        description: 'Minimum severity (critical|high|medium|low) at which a FIXABLE OSV finding blocks the pipeline when the gate is in block mode. Findings with no available fix, or below this severity, are always warnings. Default: critical (gate policy v2, 2026-08-24 — high left 22/24 weekly schedules red on transitive devDeps; see cicd-security-reusable.md).'
        type: string
        default: critical
      grype-fail-on-severity:
        description: 'Minimum severity (critical|high|medium|low) at which a FIXABLE container finding blocks the pipeline when the gate is in block mode. Unfixed CVEs, or fixable findings below this severity, are always warnings. Default: critical (gate policy v2).'
        type: string
        default: critical
      gate-mode:
        description: 'auto | block | report. auto (default) = block on push, report on pull_request/schedule. report mode never fails the job: findings land in the summary/annotations, and on schedule the weekly-security-report job upserts one rolling issue per repo (label weekly-security-review). Gitleaks always blocks regardless of mode.'
        type: string
        default: auto
    secrets:
      npm-token:
        description: '[DEPRECATED — prefer app-id + private-key] Static token for private @skylabs-digital npm packages, injected as --mount=type=secret,id=npm_token during Docker builds.'
        required: false
      app-id:
        description: 'GitHub App ID (e.g. semantic-release-bot-skylabs). If provided together with private-key, the workflow generates an ephemeral installation token and uses it as npm_token for Docker builds. Takes precedence over npm-token.'
        required: false
      private-key:
        description: 'GitHub App private key matching app-id.'
        required: false

jobs:
  osv-scan:
    if: ${{ !inputs.gitleaks-only }}
    name: OSV-Scanner (deps)
    runs-on: [self-hosted, linux, x64, skylabs]
    # Reads the checkout; the scanners need nothing else.
    permissions:
      contents: read
    timeout-minutes: 20
    outputs:
      summary_b64: ${{ steps.gate.outputs.summary_b64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # OSV-Scanner has no native "--only-fixed" (unlike Grype), so run it
      # non-blocking with JSON output and let the gate step below decide.
      # continue-on-error: the scanner exits 1 when it finds vulns; we don't
      # want that exit to fail the job — the policy in the next step does.
      - name: Run OSV-Scanner (JSON, non-blocking)
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@c51854704019a247608d928f370c98740469d4b5  # v2.3.5
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            ${{ inputs.osv-scan-args }}

      # Policy gate (parity with Grype --fail-on high --only-fixed):
      #   BLOCK  iff a finding is fixable (a patched version exists) AND its
      #          severity >= osv-fail-on-severity.
      #   WARN   for everything else — no fix available yet, or below threshold.
      # Nothing is silently dropped: all findings are listed in the job summary.
      - name: Gate on fixable findings
        id: gate
        env:
          FAIL_ON: ${{ inputs.osv-fail-on-severity }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          GATE_MODE: ${{ inputs.gate-mode }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # $RUNNER_TEMP, not /tmp: /tmp is shared by every job on the host.
          cat > "${RUNNER_TEMP}/osv-gate.cjs" <<'GATE'
          const fs = require('fs');
          const FAIL_ON = (process.env.FAIL_ON || 'critical').toLowerCase();
          // Gate policy v2: block only on push (deploy about to happen); report on
          // PR (the findings are not the PR's) and schedule (weekly review input).
          const MODE = (process.env.GATE_MODE || 'auto') === 'auto'
            ? (process.env.EVENT === 'push' ? 'block' : 'report')
            : process.env.GATE_MODE;
          const RANK = { critical: 4, high: 3, medium: 2, moderate: 2, low: 1, unknown: 0 };
          const threshold = RANK[FAIL_ON] ?? 3;
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const append = (s) => { if (summaryPath) fs.appendFileSync(summaryPath, s + '\n'); console.log(s); };

          // FAIL-CLOSED in block mode (DEP-18(3)): a scanner that did not
          // produce a result is not a clean result. On a push to main (the
          // deploy is next) that is red; on PR/schedule it stays a warning.
          const noResult = (why) => {
            const level = MODE === 'block' ? 'error' : 'warning';
            const msg = `OSV-Scanner produced no usable result (${why}) — ${MODE === 'block' ? 'blocking: nothing was scanned' : 'not blocking in report mode'}.`;
            console.log(`::${level} title=OSV-Scanner::${msg}`);
            append(`## OSV-Scanner\n\n${msg}`);
            process.exit(MODE === 'block' ? 1 : 0);
          };

          if (!fs.existsSync('osv-results.json')) {
            // Scanner produced no file. Distinguish "clean" (exit 0) from a real error.
            if (process.env.OSV_OUTCOME === 'success') {
              append(`## OSV-Scanner\n\nNo vulnerabilities found.`);
              process.exit(0);
            }
            noResult('no results file; the scan step failed');
          }

          let data;
          try { data = JSON.parse(fs.readFileSync('osv-results.json', 'utf8')); }
          catch (e) { noResult(`could not parse the results: ${e.message}`); }

          const scoreToRank = (s) => s >= 9 ? 4 : s >= 7 ? 3 : s >= 4 ? 2 : s > 0 ? 1 : 0;
          const rankToLabel = { 4: 'critical', 3: 'high', 2: 'medium', 1: 'low', 0: 'unknown' };
          const blocking = [], warnings = [];

          for (const res of data.results || []) {
            const source = res.source && res.source.path ? res.source.path : '';
            for (const pkg of res.packages || []) {
              const p = pkg.package || {};
              // id -> CVSS score from groups[].max_severity (most reliable numeric severity)
              const cvss = new Map();
              for (const g of pkg.groups || []) {
                const sc = parseFloat(g.max_severity);
                if (!Number.isNaN(sc)) for (const id of g.ids || []) cvss.set(id, sc);
              }
              for (const v of pkg.vulnerabilities || []) {
                const fixable = (v.affected || []).some(a =>
                  (a.ranges || []).some(r => (r.events || []).some(e => 'fixed' in e)));
                let rank;
                if (cvss.has(v.id)) rank = scoreToRank(cvss.get(v.id));
                else rank = RANK[((v.database_specific && v.database_specific.severity) || '').toLowerCase()] ?? 0;
                const rec = { id: v.id, pkg: `${p.name}@${p.version}`, sev: rankToLabel[rank], source, fixable };
                (fixable && rank >= threshold ? blocking : warnings).push(rec);
              }
            }
          }

          const dedupe = (arr) => { const m = new Map(); for (const r of arr) m.set(`${r.id}|${r.pkg}`, r); return [...m.values()]; };
          const B = dedupe(blocking), W = dedupe(warnings);
          const table = (rows) => rows.length
            ? ['| ID | Package | Severity | Fix |', '|---|---|---|---|',
               ...rows.map(r => `| ${r.id} | ${r.pkg} | ${r.sev} | ${r.fixable ? 'available' : 'none yet'} |`)].join('\n')
            : '_none_';

          append(`## OSV-Scanner — dependency vulnerabilities`);
          append(`Policy: **${MODE}** mode — fixable ≥ **${FAIL_ON}** ${MODE === 'block' ? 'fails this run' : 'is reported (would block a push to main)'}; no-fix-yet and below-threshold are always warnings.\n`);
          append(`- 🚫 Blocking (fixable, ≥ ${FAIL_ON}): **${B.length}**`);
          append(`- ⚠️ Warnings (no fix yet, or below threshold): **${W.length}**\n`);
          if (B.length) { append(`### 🚫 Blocking`); append(table(B) + '\n'); }
          append(`### ⚠️ Warnings`); append(table(W) + '\n');

          for (const r of W) console.log(`::warning title=OSV ${r.id} (${r.sev}, ${r.fixable ? 'fix available, below threshold' : 'no fix yet'})::${r.pkg} in ${r.source}`);
          const ann = MODE === 'block' ? 'error' : 'warning';
          for (const r of B) console.log(`::${ann} title=OSV ${r.id} (${r.sev}, fix available)::${r.pkg} in ${r.source} — upgrade to a patched version`);

          // Hand the tables to the weekly-security-report job (rolling issue).
          if (process.env.GITHUB_OUTPUT) {
            const md = [`- Blocking-grade (fixable ≥ ${FAIL_ON}): **${B.length}**`, `- Warnings: **${W.length}**`, '',
                        B.length ? '### Fixable ≥ threshold\n' + table(B) : '', W.length ? '### Warnings\n' + table(W) : ''].join('\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary_b64=${Buffer.from(md).toString('base64')}\n`);
          }

          if (B.length && MODE === 'block') { console.error(`\nBlocking: ${B.length} fixable ${FAIL_ON}+ vuln(s).`); process.exit(1); }
          if (B.length) { console.log(`\nreport mode: ${B.length} finding(s) would block a push to main — not failing this ${process.env.EVENT} run.`); }
          else { console.log(`\nNo blocking findings. ${W.length} warning(s) reported (non-blocking).`); }
          GATE
          node "${RUNNER_TEMP}/osv-gate.cjs"

  secrets-scan:
    name: Gitleaks (secrets in code + history)
    runs-on: [self-hosted, linux, x64, skylabs]
    # Reads the checkout; the scanners need nothing else.
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Gitleaks v8.30.1
        run: |
          set -euo pipefail
          VERSION=8.30.1
          case "$(uname -m)" in
            x86_64)
              ASSET=gitleaks_${VERSION}_linux_x64.tar.gz
              SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              ;;
            aarch64|arm64)
              ASSET=gitleaks_${VERSION}_linux_arm64.tar.gz
              SHA256=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          # Into this job's $RUNNER_TEMP, not /usr/local/bin with sudo: the
          # runners are persistent hosts (DEP-02), and a binary in a shared
          # path outlives the job and gets reused by the next one unverified.
          BIN_DIR="${RUNNER_TEMP}/gitleaks-${VERSION}"
          mkdir -p "${BIN_DIR}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}" -o "${BIN_DIR}/gitleaks.tgz"
          echo "${SHA256}  ${BIN_DIR}/gitleaks.tgz" | sha256sum -c -
          tar -xzf "${BIN_DIR}/gitleaks.tgz" -C "${BIN_DIR}" gitleaks
          rm -f "${BIN_DIR}/gitleaks.tgz"
          echo "${BIN_DIR}" >> "$GITHUB_PATH"
          "${BIN_DIR}/gitleaks" version

      # Full-history secret scan. A leaked secret stays leaked, so we keep
      # exit-code 1 on real findings — but allow callers to suppress confirmed
      # false positives so the gate doesn't cry wolf:
      #   - .gitleaks.toml   (regex/path/stopword allowlist) — threaded via -c
      #   - .gitleaksignore  (per-finding fingerprints)       — auto-loaded by gitleaks
      - name: Scan repository (full history)
        run: |
          set -euo pipefail
          CONFIG_FLAG=""
          if [ -f .gitleaks.toml ]; then
            # A config WITHOUT `[extend] useDefault = true` replaces the
            # default rules instead of extending them: an allowlist-only file
            # means zero rules, and a check that is green forever (resuelto:
            # 0 findings with its config, 42 with the defaults — SEC-21).
            if ! grep -qE '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' .gitleaks.toml; then
              echo "::error title=Gitleaks config::.gitleaks.toml does not extend the default rules. Add:%0A[extend]%0AuseDefault = true%0Aat the top, or this scan checks nothing (SEC-21)."
              exit 1
            fi
            echo "Using .gitleaks.toml (extends the default rules) from calling repo"
            CONFIG_FLAG="-c .gitleaks.toml"
          fi
          gitleaks detect --source . $CONFIG_FLAG --redact --exit-code 1 --verbose

  docker-scan:
    # Runs only on push/schedule events, never on pull_request.
    # PRs are covered by osv-scan on package lockfiles; container builds are expensive (~5-10 min/image).
    if: ${{ inputs.docker-images != '[]' && github.event_name != 'pull_request' }}
    name: Grype (${{ matrix.image.name }})
    runs-on: [self-hosted, linux, x64, skylabs]
    # Reads the checkout; the scanners need nothing else.
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(inputs.docker-images) }}
    steps:
      # Reusable workflows can't reference `secrets.*` directly inside a
      # step-level `if:` — it causes a startup failure. So we first dump
      # the secret presence into a step output, then gate subsequent
      # steps on that output.
      - name: Detect App Token availability
        id: has-app
        env:
          APP_ID: ${{ secrets.app-id }}
          PRIVATE_KEY: ${{ secrets.private-key }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${PRIVATE_KEY}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      # When app-id + private-key are provided, generate an ephemeral
      # installation token and prefer it over the legacy npm-token secret.
      # This avoids shipping a long-lived PAT across repos.
      - name: Generate GitHub App Token (if configured)
        id: app-token
        if: steps.has-app.outputs.available == 'true'
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.private-key }}
          owner: ${{ github.repository_owner }}

      - name: Resolve npm_token for Docker build
        id: npm
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.npm-token }}
        run: |
          # Prefer app-generated token (short-lived, scoped). Fall back to
          # the legacy static `npm-token` for backward compatibility with
          # callers that haven't migrated yet.
          if [ -n "${APP_TOKEN}" ]; then
            echo "source=app-token (ephemeral installation token)"
            echo "::add-mask::${APP_TOKEN}"
            echo "token=${APP_TOKEN}" >> $GITHUB_OUTPUT
          elif [ -n "${NPM_TOKEN}" ]; then
            echo "source=npm-token (legacy)"
            echo "::add-mask::${NPM_TOKEN}"
            echo "token=${NPM_TOKEN}" >> $GITHUB_OUTPUT
          else
            echo "source=none"
            echo "token=" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v3.11.1

      - name: Build image (local, no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v6.18.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image.name }}:${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          secrets: |
            npm_token=${{ steps.npm.outputs.token }}

      # The release tarball with a pinned checksum, into $RUNNER_TEMP. It used
      # to be `curl …/install.sh | sh -s -- -b /usr/local/bin`: a script run
      # unverified, writing into a path every later job on this persistent
      # host trusts (DEP-16(4)). Checksums from grype_0.111.1_checksums.txt of
      # the GitHub release, and re-hashed from the downloaded tarball.
      - name: Install Grype v0.111.1
        run: |
          set -euo pipefail
          VERSION=0.111.1
          case "$(uname -m)" in
            x86_64)
              ASSET=grype_${VERSION}_linux_amd64.tar.gz
              SHA256=2bc0bc60f1f4e10b0429f5e84517ec4cf0d769d2ef66875c64fc6640e136fd8f
              ;;
            aarch64|arm64)
              ASSET=grype_${VERSION}_linux_arm64.tar.gz
              SHA256=ba126117fbe14ad9797a3080812f4398742dfad91208c87ce8d44717f6e1fbc5
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          BIN_DIR="${RUNNER_TEMP}/grype-${VERSION}"
          mkdir -p "${BIN_DIR}"
          curl -sSfL "https://github.com/anchore/grype/releases/download/v${VERSION}/${ASSET}" -o "${BIN_DIR}/grype.tgz"
          echo "${SHA256}  ${BIN_DIR}/grype.tgz" | sha256sum -c -
          tar -xzf "${BIN_DIR}/grype.tgz" -C "${BIN_DIR}" grype
          rm -f "${BIN_DIR}/grype.tgz"
          echo "${BIN_DIR}" >> "$GITHUB_PATH"
          "${BIN_DIR}/grype" version

      # Scan to JSON (non-blocking), then apply the same fixability policy as
      # the OSV gate: BLOCK only on FIXABLE findings >= grype-fail-on-severity;
      # unfixed CVEs and below-threshold findings are warnings. .grype.yaml
      # ignores are honoured (matched entries move to ignoredMatches).
      - name: Scan image (JSON, non-blocking)
        id: grype
        env:
          IMAGE_REF: ${{ matrix.image.name }}:${{ github.sha }}
        run: |
          set -euo pipefail
          CONFIG_FLAG=""
          if [ -f .grype.yaml ]; then
            echo "Using .grype.yaml from calling repo"
            CONFIG_FLAG="-c .grype.yaml"
          fi
          # grype exits 0 when it scanned (findings or not: no --fail-on here)
          # and non-zero when it could not. The gate decides what that means.
          rc=0
          grype "${IMAGE_REF}" $CONFIG_FLAG -o json > grype-results.json || rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Gate on fixable findings
        env:
          FAIL_ON: ${{ inputs.grype-fail-on-severity }}
          IMAGE: ${{ matrix.image.name }}
          GATE_MODE: ${{ inputs.gate-mode }}
          EVENT: ${{ github.event_name }}
          GRYPE_RC: ${{ steps.grype.outputs.rc }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/grype-gate.cjs" <<'GATE'
          const fs = require('fs');
          const FAIL_ON = (process.env.FAIL_ON || 'critical').toLowerCase();
          const MODE = (process.env.GATE_MODE || 'auto') === 'auto'
            ? (process.env.EVENT === 'push' ? 'block' : 'report')
            : process.env.GATE_MODE;
          const IMAGE = process.env.IMAGE || 'image';
          const RANK = { critical: 4, high: 3, medium: 2, low: 1, negligible: 0, unknown: 0 };
          const threshold = RANK[FAIL_ON] ?? 3;
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const append = (s) => { if (summaryPath) fs.appendFileSync(summaryPath, s + '\n'); console.log(s); };

          // FAIL-CLOSED in block mode (DEP-18(3)): a scan that did not run is
          // not a clean scan. Red on a push to main, a warning otherwise.
          const noResult = (why) => {
            const level = MODE === 'block' ? 'error' : 'warning';
            console.log(`::${level} title=Grype::no usable result for ${IMAGE} (${why}) — ${MODE === 'block' ? 'blocking: nothing was scanned' : 'not blocking in report mode'}.`);
            append(`## Grype — ${IMAGE}\n\nNo usable result (${why}).`);
            process.exit(MODE === 'block' ? 1 : 0);
          };
          if ((process.env.GRYPE_RC || '0') !== '0') noResult(`grype exited ${process.env.GRYPE_RC}`);

          let data;
          try { data = JSON.parse(fs.readFileSync('grype-results.json', 'utf8')); }
          catch (e) { noResult(`could not parse the results: ${e.message}`); }

          const blocking = [], warnings = [];
          for (const m of data.matches || []) {
            const v = m.vulnerability || {}, a = m.artifact || {};
            const sev = (v.severity || 'unknown').toLowerCase();
            const fixable = (v.fix && v.fix.state) === 'fixed';
            const rec = { id: v.id, pkg: `${a.name}@${a.version}`, sev, fixable };
            (fixable && (RANK[sev] ?? 0) >= threshold ? blocking : warnings).push(rec);
          }
          const dedupe = (arr) => { const m = new Map(); for (const r of arr) m.set(`${r.id}|${r.pkg}`, r); return [...m.values()]; };
          const B = dedupe(blocking), W = dedupe(warnings);
          const ignored = (data.ignoredMatches || []).length;
          const table = (rows) => rows.length
            ? ['| ID | Package | Severity | Fix |', '|---|---|---|---|',
               ...rows.map(r => `| ${r.id} | ${r.pkg} | ${r.sev} | ${r.fixable ? 'available' : 'none yet'} |`)].join('\n')
            : '_none_';

          append(`## Grype — ${IMAGE}`);
          append(`Policy: block on **fixable** findings of severity **${FAIL_ON}+**; unfixed and below-threshold are warnings.${ignored ? ` (${ignored} ignored via .grype.yaml)` : ''}\n`);
          append(`- 🚫 Blocking (fixable, ≥ ${FAIL_ON}): **${B.length}**`);
          append(`- ⚠️ Warnings (unfixed, or below threshold): **${W.length}**\n`);
          if (B.length) { append(`### 🚫 Blocking`); append(table(B) + '\n'); }
          // Container images carry many low/negligible OS-package CVEs — cap the
          // warning table (and skip per-finding annotations) to avoid flooding.
          append(`### ⚠️ Warnings`); append(table(W.slice(0, 50)) + '\n');
          if (W.length > 50) append(`_…and ${W.length - 50} more warnings (full list in the Grype step log)._\n`);

          for (const r of B) console.log(`::error title=Grype ${r.id} (${r.sev}, fix available)::${r.pkg} in ${IMAGE} — rebuild with a patched base image / dependency`);
          if (B.length && MODE === 'block') { console.error(`\nBlocking: ${B.length} fixable ${FAIL_ON}+ vuln(s) in ${IMAGE}.`); process.exit(1); }
          if (B.length) { console.log(`\nreport mode: ${B.length} finding(s) in ${IMAGE} would block a push to main — not failing this ${process.env.EVENT} run.`); }
          else { console.log(`\nNo blocking findings in ${IMAGE}. ${W.length} warning(s) (non-blocking).`); }
          GATE
          node "${RUNNER_TEMP}/grype-gate.cjs"

  # ============================================================
  # WEEKLY ROLLING ISSUE (schedule only) — gate policy v2.
  # One issue per repo (label weekly-security-review), updated in place: the
  # Monday fleet review reads these instead of red runs. Needs the CALLER's
  # workflow to grant `issues: write` — but this job must NOT declare it in a
  # `permissions:` block: in a reusable workflow, a job-level request the
  # caller doesn't grant is rejected at compile time (startup_failure for the
  # ENTIRE run, on every event, before continue-on-error can apply). Inherit
  # the caller's permissions instead; without the grant the upsert step 403s
  # at runtime and continue-on-error keeps the run green.
  # ============================================================
  weekly-security-report:
    name: Weekly security review (rolling issue)
    if: ${{ always() && github.event_name == 'schedule' && !inputs.gitleaks-only }}
    needs: [osv-scan]
    runs-on: [self-hosted, linux, x64, skylabs]
    timeout-minutes: 15
    steps:
      - name: Upsert rolling issue
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        env:
          SUMMARY_B64: ${{ needs.osv-scan.outputs.summary_b64 }}
        with:
          script: |
            const label = 'weekly-security-review';
            const b64 = process.env.SUMMARY_B64 || '';
            const body = [
              `## Weekly security review — ${new Date().toISOString().slice(0, 10)}`,
              '',
              b64 ? Buffer.from(b64, 'base64').toString('utf8') : '_OSV summary unavailable (job skipped or failed)._',
              '',
              `Container (Grype) detail and Gitleaks: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '_Actualizado automáticamente por security.yml (gate policy v2). Triage: weekly-fleet-review.md (wrapper)._',
            ].join('\n');
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: '1d76db', description: 'Rolling weekly security review (gate policy v2)' });
            } catch (e) { if (e.status !== 422) throw e; }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open', per_page: 1 });
            if (open.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, body });
              core.info(`updated #${open[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({ ...context.repo, title: 'Weekly security review', labels: [label], body });
              core.info(`created #${created.number}`);
            }
